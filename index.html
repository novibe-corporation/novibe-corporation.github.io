<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novibe — © Novibe Corporation</title>

  <style>
    :root {
      --bg: #070b14;
      --panel: rgba(255,255,255,.06);
      --line: rgba(255,255,255,.12);
      --text: #ffffff;
      --muted: rgba(255,255,255,.68);
      --cyan: #59f0ff;
      --blue: #5aa7ff;
      --violet: #cb6bff;
      --pink: #ff6bd6;
      --shadow: 0 24px 60px rgba(0,0,0,.35);
      --radius-lg: 24px;
    }

    * { box-sizing: border-box; min-width: 0; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      overflow-x: hidden;
    }

    body {
      background:
        radial-gradient(circle at 12% 12%, rgba(89,240,255,.22), transparent 24%),
        radial-gradient(circle at 82% 18%, rgba(203,107,255,.20), transparent 24%),
        radial-gradient(circle at 50% 75%, rgba(90,167,255,.14), transparent 30%),
        linear-gradient(180deg, #05070d 0%, #070b14 45%, #060913 100%);
    }

    a { text-decoration: none; color: inherit; }

    /* TOPBAR */
    .topbar {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 50;
      background: rgba(7,11,20,.6);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    .topbar-inner {
      max-width: 1180px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--cyan), var(--violet));
    }

    nav {
      display: flex;
      gap: 20px;
    }

    nav a {
      opacity: .7;
    }

    nav a:hover {
      opacity: 1;
    }

    .btn {
      padding: 12px 16px;
      border-radius: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
    }

    .btn.secondary {
      background: transparent;
      border: 1px solid var(--line);
      color: white;
    }

    .auth-buttons {
      display: flex;
      gap: 10px;
    }

    /* HERO */
    main {
      padding-top: 100px;
      max-width: 1180px;
      margin: auto;
      padding-left: 16px;
      padding-right: 16px;
    }

    .hero {
      padding: 80px 0;
      text-align: center;
    }

    .hero h1 {
      font-size: 3rem;
    }

    .grad {
      background: linear-gradient(135deg, var(--cyan), var(--violet));
      -webkit-background-clip: text;
      color: transparent;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 20px;
      border-radius: var(--radius-lg);
      margin-top: 20px;
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">

    <div class="brand">
      <div class="logo"></div>
      <strong>Novibe</strong>
    </div>

    <nav>
      <a href="#features">Fonctions</a>
      <a href="#about">À propos</a>
    </nav>

    <!-- IMPORTANT : zone dynamique -->
    <div class="auth-buttons" id="authButtons">
      <a class="btn secondary" href="/login">Connexion</a>
      <a class="btn" href="/signup">Inscription</a>
    </div>

  </div>
</header>

<main>

  <section class="hero">
    <h1>Crée. <span class="grad">Héberge.</span> Code.</h1>
    <p>Novibe est une plateforme moderne pour créer et héberger des projets web.</p>

    <div class="card">
      Interface futuriste, hosting, éditeur intégré et système indépendant.
    </div>
  </section>

</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDdMYtSr2FeNGay_Nwv8oLMXg7WVQspOJ8",
    authDomain: "novibe-a5c1f.firebaseapp.com",
    projectId: "novibe-a5c1f",
    storageBucket: "novibe-a5c1f.firebasestorage.app",
    messagingSenderId: "312673438609",
    appId: "1:312673438609:web:2fbf719814a6c8c61a2830"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const authButtons = document.getElementById("authButtons");

  onAuthStateChanged(auth, (user) => {

    if (user) {
      authButtons.innerHTML = `
        <a class="btn" href="/create">Créer</a>
        <button class="btn secondary" id="logoutBtn">Déconnexion</button>
      `;

      document.getElementById("logoutBtn").addEventListener("click", async () => {
        await signOut(auth);
        location.reload();
      });

    } else {
      authButtons.innerHTML = `
        <a class="btn secondary" href="/login">Connexion</a>
        <a class="btn" href="/signup">Inscription</a>
      `;
    }
  });

</script>

</body>
</html>
