<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novibe — Editor</title>

  <style>
    :root{
      --bg:#070b14;
      --panel:rgba(255,255,255,.06);
      --line:rgba(255,255,255,.12);
      --text:#ffffff;
      --muted:rgba(255,255,255,.68);
      --cyan:#59f0ff;
      --blue:#5aa7ff;
      --violet:#cb6bff;
      --pink:#ff6bd6;
      --shadow:0 24px 60px rgba(0,0,0,.35);
      --radius-lg:24px;
    }

    *{
      box-sizing:border-box;
      min-width:0;
    }

    html,body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,system-ui,sans-serif;
      overflow-x:hidden;
      scroll-behavior:smooth;
    }

    body{
      background:
        radial-gradient(circle at 12% 12%, rgba(89,240,255,.22), transparent 24%),
        radial-gradient(circle at 82% 18%, rgba(203,107,255,.20), transparent 24%),
        radial-gradient(circle at 50% 75%, rgba(90,167,255,.14), transparent 30%),
        linear-gradient(180deg, #05070d 0%, #070b14 45%, #060913 100%);
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    @keyframes floaty {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 rgba(89,240,255,.18); }
      50% { box-shadow: 0 0 22px rgba(89,240,255,.34); }
      100% { box-shadow: 0 0 0 rgba(89,240,255,.18); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes softZoom {
      from { opacity: 0; transform: scale(.98); }
      to { opacity: 1; transform: scale(1); }
    }

    .wrap{
      min-height:100vh;
      position:relative;
      overflow-x:clip;
    }

    .glow{
      position:fixed;
      border-radius:999px;
      filter:blur(50px);
      pointer-events:none;
      z-index:0;
      opacity:.9;
    }

    .glow.one{
      top:-120px;
      left:-60px;
      width:360px;
      height:360px;
      background:rgba(89,240,255,.25);
    }

    .glow.two{
      bottom:-140px;
      right:-60px;
      width:420px;
      height:420px;
      background:rgba(203,107,255,.22);
    }

    .glow.three{
      top:30%;
      left:46%;
      width:300px;
      height:300px;
      background:rgba(90,167,255,.16);
    }

    /* ===== HEADER NOVIBE ===== */

    .topbar{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      z-index:50;
      backdrop-filter:blur(10px);
      background:rgba(7,11,20,.58);
      border-bottom:1px solid var(--line);
    }

    .topbar-inner{
      width:min(1180px, calc(100% - 32px));
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      padding:18px 0;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:14px;
      animation:fadeUp .7s ease;
    }

    .logo{
      width:44px;
      height:44px;
      border-radius:16px;
      background:linear-gradient(135deg,var(--cyan),var(--violet));
      box-shadow:0 12px 36px rgba(89,240,255,.22);
      animation:floaty 5s ease-in-out infinite;
      flex:0 0 auto;
    }

    .brand h1{
      margin:0;
      font-size:1.4rem;
      line-height:1;
      letter-spacing:-.04em;
    }

    .brand p{
      margin:3px 0 0;
      color:var(--muted);
      font-size:.82rem;
    }

    .auth-buttons{
      display:flex;
      align-items:center;
      gap:12px;
      flex-wrap:nowrap;
      animation:fadeUp .7s ease;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      border:0;
      cursor:pointer;
      font-weight:800;
      border-radius:18px;
      padding:14px 20px;
      color:#071018;
      background:linear-gradient(135deg,var(--cyan),var(--blue));
      box-shadow:0 16px 40px rgba(89,240,255,.18);
      transition:transform .18s ease, filter .18s ease;
      white-space:nowrap;
      animation:pulseGlow 4s infinite;
    }

    .btn:hover{
      transform:translateY(-2px);
      filter:brightness(1.05);
    }

    .btn.secondary{
      color:#fff;
      background:rgba(255,255,255,.05);
      border:1px solid var(--line);
      box-shadow:none;
      backdrop-filter:blur(14px);
    }

    /* ===== MAIN ===== */

    main{
      position:relative;
      z-index:2;
      padding-top:150px;
      padding-bottom:40px;
      width:min(1400px, calc(100% - 32px));
      margin:0 auto;
    }

    .editor-shell{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:28px;
      box-shadow:var(--shadow);
      overflow:hidden;
      backdrop-filter:blur(12px);
      animation:fadeUp .85s ease, softZoom .85s ease;
    }

    .toolbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:16px 18px;
      border-bottom:1px solid var(--line);
      background:rgba(255,255,255,.03);
      flex-wrap:wrap;
    }

    .tabs{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
      min-width:0;
    }

    .tab{
      display:inline-flex;
      align-items:center;
      gap:10px;
      border:1px solid transparent;
      border-radius:16px 16px 10px 10px;
      padding:10px 14px;
      cursor:pointer;
      background:rgba(255,255,255,.04);
      color:rgba(255,255,255,.72);
      transition:.18s ease;
      font-size:.92rem;
      white-space:nowrap;
    }

    .tab:hover{
      background:rgba(255,255,255,.07);
      color:white;
    }

    .tab.active{
      background:linear-gradient(180deg, rgba(89,240,255,.18), rgba(255,255,255,.05));
      color:white;
      border-color:rgba(255,255,255,.10);
      box-shadow:0 10px 24px rgba(89,240,255,.10);
    }

    .tab-dot{
      width:10px;
      height:10px;
      border-radius:999px;
      background:linear-gradient(135deg,var(--cyan),var(--violet));
      flex:0 0 auto;
    }

    .actions{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .icon-btn{
      width:44px;
