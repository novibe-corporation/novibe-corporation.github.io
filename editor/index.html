<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novibe — Editor</title>

  <style>
    :root {
      --bg: #070b14;
      --panel: rgba(255,255,255,.06);
      --line: rgba(255,255,255,.12);
      --text: #ffffff;
      --muted: rgba(255,255,255,.68);
      --cyan: #59f0ff;
      --blue: #5aa7ff;
      --violet: #cb6bff;
      --pink: #ff6bd6;
      --shadow: 0 24px 60px rgba(0,0,0,.35);
      --radius-lg: 24px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 12%, rgba(89,240,255,.22), transparent 24%),
        radial-gradient(circle at 82% 18%, rgba(203,107,255,.20), transparent 24%),
        linear-gradient(180deg, #05070d 0%, #070b14 100%);
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* ===== TOPBAR ===== */

    .topbar {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(7,11,20,.6);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      z-index: 20;
    }

    .topbar-inner {
      width: min(1180px, calc(100% - 32px));
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      gap: 20px;
    }

    .brand {
      display:flex;
      align-items:center;
      gap:12px;
    }

    .logo {
      width:44px;
      height:44px;
      border-radius:14px;
      background: linear-gradient(135deg,var(--cyan),var(--violet));
      box-shadow: 0 10px 30px rgba(89,240,255,.25);
    }

    nav {
      display:flex;
      gap:20px;
    }

    nav a {
      color: rgba(255,255,255,.7);
      font-size: .95rem;
      transition: .2s;
    }

    nav a:hover {
      color: white;
    }

    .auth-buttons {
      display:flex;
      gap:10px;
    }

    .btn {
      padding: 12px 16px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      background: linear-gradient(135deg,var(--cyan),var(--blue));
      color: #071018;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn.secondary {
      background: rgba(255,255,255,.05);
      border: 1px solid var(--line);
      color: white;
    }

    /* ===== MAIN ===== */

    main {
      padding-top: 110px;
      width: min(1400px, calc(100% - 32px));
      margin: auto;
      padding-bottom: 40px;
    }

    .editor-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 18px;
    }

    .sidebar,
    .editor-box {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 26px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .sidebar {
      padding: 22px;
      height: fit-content;
    }

    .sidebar h2 {
      margin-top: 0;
      font-size: 1.3rem;
    }

    .sidebar p {
      color: var(--muted);
      line-height: 1.6;
      font-size: .95rem;
    }

    .tool-list {
      margin-top: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tool-item {
      padding: 14px;
      border-radius: 16px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
    }

    .tool-item strong {
      display: block;
      margin-bottom: 4px;
    }

    .tool-item span {
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.5;
    }

    .editor-box {
      overflow: hidden;
    }

    .editor-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.03);
      flex-wrap: wrap;
      gap: 12px;
    }

    .editor-topbar h1 {
      margin: 0;
      font-size: 1.2rem;
    }

    .editor-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .editor-content {
      padding: 18px;
    }

    textarea {
      width: 100%;
      height: 520px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(0,0,0,.28);
      color: white;
      padding: 18px;
      outline: none;
      font-family: Consolas, monospace;
      font-size: .95rem;
      line-height: 1.6;
    }

    .preview-box {
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      background: white;
      height: 420px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }

    .message {
      margin-top: 14px;
      color: var(--muted);
      min-height: 24px;
    }

    @media (max-width: 980px) {

      .topbar-inner {
        flex-wrap: wrap;
        justify-content: center;
        text-align: center;
      }

      nav {
        display: none;
      }

      .editor-layout {
        grid-template-columns: 1fr;
      }

      textarea {
        height: 420px;
      }
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">

    <div class="brand">
      <div class="logo"></div>
      <div>
        <strong>Novibe</strong><br>
        <small>© Corporation</small>
      </div>
    </div>

    <nav>
      <a href="/home">Home</a>
      <a href="/sites">Sites</a>
      <a href="/wiki">Wiki</a>
    </nav>

    <div class="auth-buttons">
      <a class="btn secondary" href="/create">Créer</a>
      <button class="btn" id="logoutBtn">Déconnexion</button>
    </div>

  </div>
</header>

<main>

  <div class="editor-layout">

    <aside class="sidebar">

      <h2>Novibe Editor</h2>

      <p>
        Éditeur intégré moderne pour coder directement sur Novibe.
      </p>

      <div class="tool-list">

        <div class="tool-item">
          <strong>HTML</strong>
          <span>Structure de la page web</span>
        </div>

        <div class="tool-item">
          <strong>CSS</strong>
          <span>Design et interface utilisateur</span>
        </div>

        <div class="tool-item">
          <strong>JavaScript</strong>
          <span>Fonctions et interactions</span>
        </div>

        <div class="tool-item">
          <strong>Live Preview</strong>
          <span>Aperçu instantané du rendu</span>
        </div>

      </div>

    </aside>

    <section class="editor-box">

      <div class="editor-topbar">
        <h1>editor.html</h1>

        <div class="editor-actions">
          <button class="btn secondary" id="clearBtn">Effacer</button>
          <button class="btn" id="runBtn">Exécuter</button>
        </div>
      </div>

      <div class="editor-content">

<textarea id="code"><!DOCTYPE html>
<html>
<head>
  <title>Mon site Novibe</title>

  <style>
    body {
      background: #070b14;
      color: white;
      font-family: Arial;
      text-align: center;
      padding-top: 80px;
    }

    h1 {
      color: #59f0ff;
    }
  </style>
</head>

<body>

  <h1>Bienvenue sur Novibe</h1>
  <p>Ton site fonctionne.</p>

</body>
</html></textarea>

        <div class="message" id="message">
          Éditeur prêt.
        </div>

        <div class="preview-box">
          <iframe id="preview"></iframe>
        </div>

      </div>

    </section>

  </div>

</main>

<script>

  if(localStorage.getItem("novibe-auth") !== "true") {
    window.location.href = "/";
  }

  const code = document.getElementById("code");
  const preview = document.getElementById("preview");
  const runBtn = document.getElementById("runBtn");
  const clearBtn = document.getElementById("clearBtn");
  const message = document.getElementById("message");
  const logoutBtn = document.getElementById("logoutBtn");

  function runCode() {
    preview.srcdoc = code.value;

    message.textContent = "Aperçu mis à jour.";
    message.style.color = "#59f0ff";
  }

  runBtn.addEventListener("click", runCode);

  clearBtn.addEventListener("click", () => {

    code.value = "";

    preview.srcdoc = "";

    message.textContent = "Éditeur vidé.";
    message.style.color = "#ff6bd6";
  });

  logoutBtn.addEventListener("click", () => {

    localStorage.removeItem("novibe-auth");

    window.location.href = "/";
  });

  runCode();

</script>

</body>
</html>
