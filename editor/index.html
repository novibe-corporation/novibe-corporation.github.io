<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Novibe — Editor</title>

  <style>
    :root{
      --bg:#070b14;
      --panel:rgba(255,255,255,.06);
      --line:rgba(255,255,255,.12);
      --text:#ffffff;
      --muted:rgba(255,255,255,.68);
      --cyan:#59f0ff;
      --blue:#5aa7ff;
      --violet:#cb6bff;
      --pink:#ff6bd6;
      --shadow:0 24px 60px rgba(0,0,0,.35);
      --radius-lg:24px;
    }

    *{
      box-sizing:border-box;
      min-width:0;
    }

    html,body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,system-ui,sans-serif;
      overflow-x:hidden;
    }

    body{
      background:
        radial-gradient(circle at 12% 12%, rgba(89,240,255,.22), transparent 24%),
        radial-gradient(circle at 82% 18%, rgba(203,107,255,.20), transparent 24%),
        radial-gradient(circle at 50% 75%, rgba(90,167,255,.14), transparent 30%),
        linear-gradient(180deg,#05070d 0%,#070b14 45%,#060913 100%);
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    .wrap{
      min-height:100vh;
      position:relative;
      overflow-x:hidden;
    }

    .glow{
      position:fixed;
      border-radius:999px;
      filter:blur(50px);
      pointer-events:none;
      z-index:0;
      opacity:.9;
    }

    .glow.one{
      top:-120px;
      left:-60px;
      width:360px;
      height:360px;
      background:rgba(89,240,255,.25);
    }

    .glow.two{
      bottom:-140px;
      right:-60px;
      width:420px;
      height:420px;
      background:rgba(203,107,255,.22);
    }

    .glow.three{
      top:30%;
      left:46%;
      width:300px;
      height:300px;
      background:rgba(90,167,255,.16);
    }

    .topbar{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      z-index:50;
      backdrop-filter:blur(10px);
      background:rgba(7,11,20,.58);
      border-bottom:1px solid var(--line);
    }

    .topbar-inner{
      width:min(1180px, calc(100% - 32px));
      margin:0 auto;
      display:flex;
      flex-direction:column;
      align-items:stretch;
      gap:14px;
      padding:18px 0 16px;
    }

    .brand{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
      text-align:left;
    }

    .logo{
      width:44px;
      height:44px;
      border-radius:16px;
      background:linear-gradient(135deg,var(--cyan),var(--violet));
      box-shadow:0 12px 36px rgba(89,240,255,.22);
      animation:floaty 5s ease-in-out infinite;
      flex:0 0 auto;
    }

    .brand h1{
      margin:0;
      font-size:1.4rem;
      line-height:1;
      letter-spacing:-.04em;
    }

    .brand p{
      margin:3px 0 0;
      color:var(--muted);
      font-size:.82rem;
    }

    .auth-buttons{
      width:100%;
      display:flex;
      align-items:center;
      gap:12px;
      flex-wrap:nowrap;
    }

    .auth-buttons .btn{
      flex:1 1 0;
      width:100%;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      border:0;
      cursor:pointer;
      font-weight:800;
      border-radius:18px;
      padding:14px 20px;
      color:#071018;
      background:linear-gradient(135deg,var(--cyan),var(--blue));
      box-shadow:0 16px 40px rgba(89,240,255,.18);
      transition:.18s ease;
      white-space:nowrap;
      animation:pulseGlow 4s infinite;
    }

    .btn:hover{
      transform:translateY(-2px);
    }

    .btn.secondary{
      color:#fff;
      background:rgba(255,255,255,.05);
      border:1px solid var(--line);
      box-shadow:none;
      backdrop-filter:blur(14px);
    }

    main{
      position:relative;
      z-index:2;
      padding-top:156px;
      padding-bottom:40px;
      width:min(1400px, calc(100% - 32px));
      margin:0 auto;
    }

    .editor-shell{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:28px;
      box-shadow:var(--shadow);
      overflow:hidden;
      backdrop-filter:blur(12px);
    }

    .toolbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:16px 18px;
      border-bottom:1px solid var(--line);
      background:rgba(255,255,255,.03);
      flex-wrap:wrap;
    }

    .tabs{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }

    .tabs.locked .tab{
      pointer-events:none;
      opacity:.55;
    }

    .tab{
      display:inline-flex;
      align-items:center;
      gap:10px;
      border:1px solid transparent;
      border-radius:16px 16px 10px 10px;
      padding:10px 14px;
      cursor:pointer;
      background:rgba(255,255,255,.04);
      color:rgba(255,255,255,.72);
      transition:.18s ease;
      font-size:.92rem;
    }

    .tab:hover{
      background:rgba(255,255,255,.07);
      color:white;
    }

    .tab.active{
      background:linear-gradient(180deg, rgba(89,240,255,.18), rgba(255,255,255,.05));
      color:white;
      border-color:rgba(255,255,255,.10);
    }

    .tab-dot{
      width:10px;
      height:10px;
      border-radius:999px;
      background:linear-gradient(135deg,var(--cyan),var(--violet));
      flex:0 0 auto;
    }

    .tab-close{
      width:18px;
      height:18px;
      border:none;
      border-radius:999px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      background:rgba(255,255,255,.10);
      color:white;
      font-size:.8rem;
      line-height:1;
      transition:.18s ease;
      padding:0;
      flex:0 0 auto;
    }

    .tab-close:hover{
      background:rgba(255,107,214,.85);
      transform:scale(1.05);
    }

    .actions{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .icon-btn{
      width:44px;
      height:44px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:14px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.05);
      color:white;
      font-size:1.2rem;
      cursor:pointer;
      transition:.18s ease;
    }

    .icon-btn:hover{
      transform:translateY(-2px);
      background:rgba(255,255,255,.08);
    }

    .icon-btn:disabled{
      opacity:.45;
      cursor:not-allowed;
      transform:none;
    }

    .workspace{
      height:78vh;
      position:relative;
    }

    .code-view,
    .preview-view{
      display:none;
      width:100%;
      height:100%;
    }

    .code-view.active,
    .preview-view.active{
      display:block;
    }

    textarea{
      width:100%;
      height:100%;
      border:none;
      outline:none;
      resize:none;
      background:transparent;
      color:white;
      padding:24px;
      font-size:15px;
      line-height:1.6;
      font-family:Consolas,monospace;
    }

    .preview{
      display:flex;
      flex-direction:column;
      width:100%;
      height:100%;
      background:#0b1220;
    }

    .browser-bar{
      height:62px;
      background:#0f172a;
      border-bottom:1px solid rgba(255,255,255,.08);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 16px;
      flex:0 0 auto;
    }

    .browser-left{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }

    .browser-icon{
      width:32px;
      height:32px;
      border-radius:10px;
      background:linear-gradient(135deg,var(--cyan),var(--violet));
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      font-weight:800;
      font-size:.85rem;
      flex:0 0 auto;
    }

    .browser-icon img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:none;
    }

    .browser-name{
      display:flex;
      flex-direction:column;
    }

    .browser-name strong{
      color:white;
      font-size:.95rem;
    }

    .browser-name span{
      color:rgba(255,255,255,.58);
      font-size:.75rem;
      margin-top:4px;
    }

    .browser-url{
      background:#10203d;
      border:1px solid rgba(255,255,255,.08);
      padding:10px 14px;
      border-radius:12px;
      color:white;
      font-size:.88rem;
      white-space:nowrap;
    }

    iframe{
      width:100%;
      height:100%;
      border:none;
      background:white;
      flex:1;
    }

    .status{
      padding:14px 18px;
      border-top:1px solid var(--line);
      color:var(--muted);
      font-size:.92rem;
    }

    .modal{
      position:fixed;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      background:rgba(0,0,0,.55);
      backdrop-filter:blur(8px);
      z-index:80;
      padding:20px;
    }

    .modal.show{
      display:flex;
    }

    .modal-card{
      width:min(520px,100%);
      background:rgba(10,14,24,.96);
      border:1px solid var(--line);
      border-radius:26px;
      box-shadow:var(--shadow);
      padding:22px;
    }

    .modal-card h3{
      margin:0 0 10px;
      font-size:1.35rem;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-top:14px;
    }

    .field input{
      width:100%;
      padding:14px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
      color:white;
      outline:none;
    }

    .modal-actions,
    .confirm-actions{
      display:flex;
      justify-content:flex-end;
      gap:10px;
      margin-top:18px;
      flex-wrap:wrap;
    }

    .hint{
      margin-top:10px;
      color:var(--muted);
      font-size:.9rem;
      line-height:1.5;
    }

    @keyframes floaty{
      0%{transform:translateY(0px);}
      50%{transform:translateY(-8px);}
      100%{transform:translateY(0px);}
    }

    @keyframes pulseGlow{
      0%{box-shadow:0 0 0 rgba(89,240,255,.18);}
      50%{box-shadow:0 0 22px rgba(89,240,255,.34);}
      100%{box-shadow:0 0 0 rgba(89,240,255,.18);}
    }

    @media(max-width:900px){
      .topbar-inner{
        width:min(1180px, calc(100% - 20px));
      }

      .workspace{
        height:70vh;
      }

      .browser-url{
        display:none;
      }
    }
  </style>
</head>
<body>

<div class="wrap">
  <div class="glow one"></div>
  <div class="glow two"></div>
  <div class="glow three"></div>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo"></div>
        <div>
          <h1>Novibe</h1>
          <p>© Novibe Corporation</p>
        </div>
      </div>

      <div class="auth-buttons">
        <a class="btn secondary" href="/create">Créer</a>
        <a class="btn" href="/home">Accueil</a>
      </div>
    </div>
  </header>

  <main>
    <div class="editor-shell">
      <div class="toolbar">
        <div class="tabs" id="tabs"></div>

        <div class="actions">
          <button class="icon-btn" id="addFileBtn" type="button">+</button>
          <button class="btn" id="runBtn" type="button">Exécuter</button>
        </div>
      </div>

      <div class="workspace">
        <div class="code-view active" id="codeView">
          <textarea id="editor"></textarea>
        </div>

        <div class="preview-view" id="previewView">
          <div class="preview">
            <div class="browser-bar">
              <div class="browser-left">
                <div class="browser-icon">
                  <img id="siteIconImg" alt="logo du site">
                  <span id="siteIconFallback">N</span>
                </div>

                <div class="browser-name">
                  <strong id="siteTitle">Mon site</strong>
                  <span>Aperçu du projet</span>
                </div>
              </div>

              <div class="browser-url" id="browserUrl">index.html</div>
            </div>

            <iframe id="frame"></iframe>
          </div>
        </div>
      </div>

      <div class="status" id="status">Éditeur prêt.</div>
    </div>
  </main>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <h3>Ajouter un fichier</h3>

    <div class="field">
      <label for="fileName">Nom du fichier</label>
      <input id="fileName" placeholder="style.css">
    </div>

    <div class="modal-actions">
      <button class="btn secondary" id="cancelBtn" type="button">Annuler</button>
      <button class="btn" id="createBtn" type="button">Créer</button>
    </div>

    <div class="hint">Les fichiers HTML peuvent être exécutés.</div>
  </div>
</div>

<div class="modal" id="deleteModal">
  <div class="modal-card">
    <h3>Supprimer le fichier ?</h3>

    <p class="hint" id="deleteText" style="margin-top:0;">
      Voulez-vous vraiment supprimer ce fichier ?
    </p>

    <div class="confirm-actions">
      <button class="btn secondary" id="deleteNoBtn" type="button">Non</button>
      <button class="btn" id="deleteYesBtn" type="button">Oui</button>
    </div>
  </div>
</div>

<script>
  if (localStorage.getItem("novibe-auth") !== "true") {
    location.href = "/";
  }

  const files = {
    "index.html": {
      type: "html",
      content: `<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mon site Novibe</title>
</head>
<body style="background:#0b1220;color:white;font-family:Arial;display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;">
<h1>Bienvenue</h1>
<p>Ton projet fonctionne.</p>
</body>
</html>`
    }
  };

  let activeFile = "index.html";
  let previewMode = false;
  let fileToDelete = "";

  const tabs = document.getElementById("tabs");
  const editor = document.getElementById("editor");
  const runBtn = document.getElementById("runBtn");
  const frame = document.getElementById("frame");

  const codeView = document.getElementById("codeView");
  const previewView = document.getElementById("previewView");

  const browserUrl = document.getElementById("browserUrl");
  const siteTitle = document.getElementById("siteTitle");
  const siteIconImg = document.getElementById("siteIconImg");
  const siteIconFallback = document.getElementById("siteIconFallback");

  const status = document.getElementById("status");
  const addFileBtn = document.getElementById("addFileBtn");

  const modal = document.getElementById("modal");
  const fileName = document.getElementById("fileName");
  const cancelBtn = document.getElementById("cancelBtn");
  const createBtn = document.getElementById("createBtn");

  const deleteModal = document.getElementById("deleteModal");
  const deleteNoBtn = document.getElementById("deleteNoBtn");
  const deleteYesBtn = document.getElementById("deleteYesBtn");

  function setStatus(text, color) {
    status.textContent = text;
    if (color) {
      status.style.color = color;
    }
  }

  function isHtmlFile(name) {
    return /\.html?$/i.test(name);
  }

  function isCssFile(name) {
    return /\.css$/i.test(name);
  }

  function isImageFile(name) {
    return /\.(png|jpg|jpeg|gif|webp|svg)$/i.test(name);
  }

  function saveCurrent() {
    if (files[activeFile]) {
      files[activeFile].content = editor.value;
    }
  }

  function renderTabs() {
    tabs.innerHTML = "";

    Object.keys(files).forEach((file) => {
      const tab = document.createElement("div");
      tab.className = "tab" + (file === activeFile ? " active" : "");
      tab.setAttribute("role", "button");
      tab.setAttribute("tabindex", "0");

      tab.innerHTML = `
        <span class="tab-dot"></span>
        <span>${file}</span>
        <button class="tab-close" type="button" title="Supprimer">×</button>
      `;

      const closeBtn = tab.querySelector(".tab-close");

      closeBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        requestDelete(file);
      });

      tab.addEventListener("click", () => {
        if (previewMode) return;

        activeFile = file;
        editor.value = files[file].content || "";

        browserUrl.textContent = file;
        siteTitle.textContent = file;

        renderTabs();
      });

      tab.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          if (!previewMode) {
            activeFile = file;
            editor.value = files[file].content || "";
            browserUrl.textContent = file;
            siteTitle.textContent = file;
            renderTabs();
          }
        }
      });

      tabs.appendChild(tab);
    });
  }

  function requestDelete(file) {
    if (Object.keys(files).length <= 1) {
      setStatus("Impossible de supprimer le dernier fichier.", "#ff6bd6");
      return;
    }

    fileToDelete = file;
    document.getElementById("deleteText").textContent =
      `Voulez-vous vraiment supprimer ${file} ?`;

    deleteModal.classList.add("show");
  }

  deleteNoBtn.addEventListener("click", () => {
    deleteModal.classList.remove("show");
    fileToDelete = "";
  });

  deleteYesBtn.addEventListener("click", () => {
    if (!fileToDelete) return;

    delete files[fileToDelete];

    if (activeFile === fileToDelete) {
      activeFile = Object.keys(files)[0];
    }

    editor.value = files[activeFile].content || "";
    renderTabs();

    if (previewMode) {
      previewMode = false;
      previewView.classList.remove("active");
      codeView.classList.add("active");
      runBtn.textContent = "Exécuter";
      tabs.classList.remove("locked");
      setStatus("Retour au code.", "#cb6bff");
    } else {
      setStatus("Fichier supprimé.", "#ff6bd6");
    }

    deleteModal.classList.remove("show");
    fileToDelete = "";
  });

  function runPreview() {
    saveCurrent();

    const current = files[activeFile];

    if (!current || current.type !== "html") {
      setStatus("Seuls les fichiers HTML peuvent être exécutés.", "#ff6bd6");
      return;
    }

    frame.srcdoc = current.content;

    previewMode = true;
    codeView.classList.remove("active");
    previewView.classList.add("active");

    runBtn.textContent = "Terminer";
    tabs.classList.add("locked");

    setStatus("Aperçu lancé.", "#59f0ff");
  }

  function stopPreview() {
    previewMode = false;
    previewView.classList.remove("active");
    codeView.classList.add("active");

    runBtn.textContent = "Exécuter";
    tabs.classList.remove("locked");

    setStatus("Retour au code.", "#cb6bff");
  }

  runBtn.addEventListener("click", () => {
    if (previewMode) {
      stopPreview();
    } else {
      runPreview();
    }
  });

  addFileBtn.addEventListener("click", () => {
    if (previewMode) return;

    modal.classList.add("show");
    fileName.value = "";
    fileName.focus();
  });

  cancelBtn.addEventListener("click", () => {
    modal.classList.remove("show");
  });

  createBtn.addEventListener("click", () => {
    const name = fileName.value.trim();

    if (!name) {
      setStatus("Nom de fichier invalide.", "#ff6bd6");
      return;
    }

    if (files[name]) {
      setStatus("Ce fichier existe déjà.", "#ff6bd6");
      return;
    }

    let type = "txt";
    let content = "";

    if (isHtmlFile(name)) {
      type = "html";
      content = `<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>${name.replace(/\.html?$/i, "") || "Novibe"}</title>
</head>
<body style="background:#0b1220;color:white;font-family:Arial;display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;">
  <h1>Nouveau fichier</h1>
  <p>${name}</p>
</body>
</html>`;
    } else if (isCssFile(name)) {
      type = "css";
    } else if (isImageFile(name)) {
      type = "image";
    }

    files[name] = { type, content };
    activeFile = name;
    editor.value = content;

    renderTabs();
    modal.classList.remove("show");
    setStatus(`Fichier créé : ${name}`, "#59f0ff");
  });

  editor.addEventListener("input", () => {
    saveCurrent();
  });

  ed
