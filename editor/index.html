<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novibe — Editor</title>

  <style>

    :root {
      --bg: #070b14;
      --panel: rgba(255,255,255,.06);
      --line: rgba(255,255,255,.12);
      --text: #ffffff;
      --muted: rgba(255,255,255,.68);
      --cyan: #59f0ff;
      --blue: #5aa7ff;
      --violet: #cb6bff;
      --pink: #ff6bd6;
      --shadow: 0 24px 60px rgba(0,0,0,.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 12%, rgba(89,240,255,.22), transparent 24%),
        radial-gradient(circle at 82% 18%, rgba(203,107,255,.20), transparent 24%),
        linear-gradient(180deg, #05070d 0%, #070b14 100%);
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* ===== HEADER OFFICIEL ===== */

    .topbar {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(7,11,20,.6);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      z-index: 20;
    }

    .topbar-inner {
      width: min(1180px, calc(100% - 32px));
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
    }

    .brand {
      display:flex;
      align-items:center;
      gap:12px;
    }

    .logo {
      width:44px;
      height:44px;
      border-radius:14px;
      background: linear-gradient(135deg,var(--cyan),var(--violet));
    }

    nav {
      display:flex;
      gap:20px;
    }

    nav a {
      color: rgba(255,255,255,.7);
      font-size: .95rem;
    }

    nav a:hover {
      color: white;
    }

    .auth-buttons {
      display:flex;
      gap:10px;
    }

    .btn {
      padding: 12px 16px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      background: linear-gradient(135deg,var(--cyan),var(--blue));
      color: #071018;
    }

    .btn.secondary {
      background: rgba(255,255,255,.05);
      border: 1px solid var(--line);
      color: white;
    }

    /* ===== MAIN ===== */

    main {
      padding-top: 110px;
      width: min(1400px, calc(100% - 32px));
      margin: auto;
      padding-bottom: 40px;
    }

    .hero {
      margin-bottom: 22px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 26px;
      padding: 28px;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
    }

    .hero h1 {
      margin: 0;
      font-size: 3rem;
      letter-spacing: -.06em;
    }

    .hero h1 span {
      background: linear-gradient(135deg,var(--cyan),var(--violet));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p {
      margin-top: 16px;
      color: var(--muted);
      line-height: 1.7;
      max-width: 850px;
    }

    /* ===== EDITOR ===== */

    .editor-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 26px;
      overflow: hidden;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
    }

    .editor-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.03);
      gap: 12px;
      flex-wrap: wrap;
    }

    .editor-top h2 {
      margin: 0;
      font-size: 1.1rem;
    }

    .editor-actions {
      display: flex;
      gap: 10px;
    }

    .editor-content {
      min-height: 720px;
    }

    .editor-workspace {
      width: 100%;
      height: 720px;
      position: relative;
    }

    .panel-title {
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      color: rgba(255,255,255,.72);
      font-size: .92rem;
      background: rgba(255,255,255,.02);
    }

    #code,
    #preview {
      width: 100%;
      height: calc(100% - 49px);
      border: none;
      outline: none;
      display: block;
    }

    #code {
      resize: none;
      padding: 20px;
      font-family: Consolas, monospace;
      font-size: .95rem;
      line-height: 1.7;
      background: transparent;
      color: white;
    }

    #preview {
      background: white;
      display: none;
    }

    .status {
      padding: 14px 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .92rem;
    }

    @media (max-width: 850px) {

      .topbar-inner {
        flex-wrap: wrap;
        justify-content: center;
        text-align: center;
      }

      nav {
        display: none;
      }

      .hero h1 {
        font-size: 2.2rem;
      }

      main {
        width: min(1400px, calc(100% - 20px));
      }

      .editor-workspace {
        height: 600px;
      }
    }

  </style>
</head>

<body>

<header class="topbar">

  <div class="topbar-inner">

    <div class="brand">
      <div class="logo"></div>

      <div>
        <strong>Novibe</strong><br>
        <small>© Corporation</small>
      </div>
    </div>

    <nav>
      <a href="/home">Home</a>
      <a href="/sites">Sites</a>
      <a href="/wiki">Wiki</a>
      <a href="/editor">Editor</a>
    </nav>

    <div class="auth-buttons">
      <a class="btn secondary" href="/create">Créer</a>
      <button class="btn" id="logoutBtn">Déconnexion</button>
    </div>

  </div>

</header>

<main>

  <section class="hero">

    <h1>Novibe <span>Editor</span></h1>

    <p>
      Éditeur de code intégré dans Novibe.
      Code directement ton site web et visualise le résultat en temps réel.
    </p>

  </section>

  <section class="editor-panel">

    <div class="editor-top">

      <h2>editor.html</h2>

      <div class="editor-actions">
        <button class="btn secondary" id="clearBtn">Effacer</button>
        <button class="btn" id="runBtn">Exécuter</button>
      </div>

    </div>

    <div class="editor-content">

      <div class="editor-workspace">

        <div class="panel-title">
          <span id="modeLabel">Code source</span>
        </div>

<textarea id="code"><!DOCTYPE html>
<html>
<head>
  <title>Mon site Novibe</title>

  <style>
    body {
      background: #070b14;
      color: white;
      font-family: Arial;
      text-align: center;
      padding-top: 80px;
    }

    h1 {
      color: #59f0ff;
      font-size: 3rem;
    }
  </style>
</head>

<body>

  <h1>Bienvenue sur Novibe</h1>

  <p>Ton site fonctionne.</p>

</body>
</html></textarea>

        <iframe id="preview"></iframe>

      </div>

    </div>

    <div class="status" id="status">
      Éditeur prêt.
    </div>

  </section>

</main>

<script>

  if(localStorage.getItem("novibe-auth") !== "true") {
    window.location.href = "/";
  }

  const code = document.getElementById("code");
  const preview = document.getElementById("preview");

  const runBtn = document.getElementById("runBtn");
  const clearBtn = document.getElementById("clearBtn");

  const status = document.getElementById("status");
  const modeLabel = document.getElementById("modeLabel");

  const logoutBtn = document.getElementById("logoutBtn");

  let previewMode = false;

  runBtn.addEventListener("click", () => {

    if(!previewMode) {

      preview.srcdoc = code.value;

      code.style.display = "none";
      preview.style.display = "block";

      runBtn.textContent = "Terminer";

      modeLabel.textContent = "Aperçu du site";

      status.textContent = "Mode aperçu activé.";
      status.style.color = "#59f0ff";

      previewMode = true;

    } else {

      preview.style.display = "none";
      code.style.display = "block";

      runBtn.textContent = "Exécuter";

      modeLabel.textContent = "Code source";

      status.textContent = "Retour au code.";
      status.style.color = "#cb6bff";

      previewMode = false;
    }

  });

  clearBtn.addEventListener("click", () => {

    code.value = "";

    preview.srcdoc = "";

    status.textContent = "Code supprimé.";
    status.style.color = "#ff6bd6";
  });

  logoutBtn.addEventListener("click", () => {

    localStorage.removeItem("novibe-auth");

    window.location.href = "/";
  });

</script>

</body>
</html>
