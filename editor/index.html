<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Novibe — Editor</title>

  <style>
    :root{
      --bg:#070b14;
      --panel:rgba(255,255,255,.06);
      --line:rgba(255,255,255,.12);
      --text:#ffffff;
      --muted:rgba(255,255,255,.68);
      --cyan:#59f0ff;
      --blue:#5aa7ff;
      --violet:#cb6bff;
      --pink:#ff6bd6;
      --shadow:0 24px 60px rgba(0,0,0,.35);
    }

    *{
      box-sizing:border-box;
      min-width:0;
    }

    html,body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,system-ui,sans-serif;
      overflow-x:hidden;
    }

    body{
      background:
        radial-gradient(circle at 12% 12%, rgba(89,240,255,.22), transparent 24%),
        radial-gradient(circle at 82% 18%, rgba(203,107,255,.20), transparent 24%),
        linear-gradient(180deg, #05070d 0%, #070b14 100%);
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    /* ===== BACKGROUND GLOW ===== */

    .glow{
      position:fixed;
      border-radius:999px;
      filter:blur(50px);
      pointer-events:none;
      z-index:0;
      opacity:.9;
    }

    .glow.one{
      top:-120px;
      left:-60px;
      width:360px;
      height:360px;
      background:rgba(89,240,255,.25);
    }

    .glow.two{
      bottom:-140px;
      right:-60px;
      width:420px;
      height:420px;
      background:rgba(203,107,255,.22);
    }

    /* ===== TRUE NOVIBE HEADER ===== */

    .topbar{
      position:fixed;
      top:0;
      width:100%;
      z-index:50;
      background:rgba(7,11,20,.6);
      backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line);
    }

    .topbar-inner{
      width:min(1180px, calc(100% - 32px));
      margin:auto;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
      padding:16px 0;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .logo{
      width:44px;
      height:44px;
      border-radius:14px;
      background:linear-gradient(135deg,var(--cyan),var(--violet));
      box-shadow:0 10px 30px rgba(89,240,255,.25);
    }

    nav{
      display:flex;
      gap:20px;
      flex-wrap:wrap;
    }

    nav a{
      color:rgba(255,255,255,.7);
      font-size:.95rem;
      transition:.2s;
    }

    nav a:hover{
      color:white;
    }

    .auth-buttons{
      display:flex;
      gap:10px;
    }

    .btn{
      padding:12px 16px;
      border-radius:14px;
      border:none;
      cursor:pointer;
      font-weight:700;
      color:#071018;
      background:linear-gradient(135deg,var(--cyan),var(--blue));
      transition:.2s;
    }

    .btn:hover{
      transform:translateY(-2px);
    }

    .btn.secondary{
      background:rgba(255,255,255,.05);
      border:1px solid var(--line);
      color:white;
    }

    /* ===== MAIN ===== */

    main{
      position:relative;
      z-index:1;
      padding-top:110px;
      width:min(1400px, calc(100% - 32px));
      margin:auto;
      padding-bottom:40px;
    }

    .editor-layout{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
    }

    .panel{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:28px;
      box-shadow:var(--shadow);
      overflow:hidden;
      backdrop-filter:blur(12px);
    }

    /* ===== CODE ===== */

    .editor-header{
      padding:18px 22px;
      border-bottom:1px solid var(--line);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      background:rgba(255,255,255,.03);
    }

    .editor-title{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .editor-dot{
      width:14px;
      height:14px;
      border-radius:999px;
      background:var(--cyan);
      box-shadow:0 0 20px rgba(89,240,255,.8);
    }

    textarea{
      width:100%;
      height:75vh;
      border:none;
      resize:none;
      outline:none;
      padding:24px;
      background:transparent;
      color:white;
      font-size:15px;
      font-family:Consolas,monospace;
      line-height:1.6;
    }

    /* ===== PREVIEW ===== */

    .preview-container{
      display:flex;
      flex-direction:column;
      height:100%;
    }

    .browser-bar{
      height:58px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 16px;
      background:rgba(255,255,255,.04);
    }

    .browser-left{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .browser-logo{
      width:30px;
      height:30px;
      border-radius:10px;
      background:linear-gradient(135deg,var(--cyan),var(--violet));
    }

    .browser-url{
      padding:10px 14px;
      border-radius:12px;
      background:rgba(0,0,0,.3);
      border:1px solid rgba(255,255,255,.08);
      color:rgba(255,255,255,.7);
      font-size:.9rem;
    }

    iframe{
      width:100%;
      height:75vh;
      border:none;
      background:white;
    }

    .empty-preview{
      display:flex;
      align-items:center;
      justify-content:center;
      height:75vh;
      color:rgba(255,255,255,.45);
      font-size:1rem;
      text-align:center;
      padding:30px;
    }

    @media(max-width:1000px){

      .topbar-inner{
        flex-wrap:wrap;
        justify-content:center;
        text-align:center;
      }

      nav{
        justify-content:center;
      }

      .auth-buttons{
        width:100%;
      }

      .auth-buttons .btn{
        flex:1;
      }

      .editor-layout{
        grid-template-columns:1fr;
      }

      textarea,
      iframe,
      .empty-preview{
        height:60vh;
      }
    }
  </style>
</head>

<body>

<div class="glow one"></div>
<div class="glow two"></div>

<header class="topbar">
  <div class="topbar-inner">

    <div class="brand">
      <div class="logo"></div>

      <div>
        <strong>Novibe</strong><br>
        <small style="color:rgba(255,255,255,.6)">
          © Corporation
        </small>
      </div>
    </div>

    <nav>
      <a href="/home">Home</a>
      <a href="/sites">Sites</a>
      <a href="/wiki">Wiki</a>
      <a href="/editor">Editor</a>
    </nav>

    <div class="auth-buttons">
      <a class="btn secondary" href="/create">Créer</a>
      <a class="btn" href="/">Déconnexion</a>
    </div>

  </div>
</header>

<main>

  <div class="editor-layout">

    <!-- CODE -->
    <div class="panel">

      <div class="editor-header">

        <div class="editor-title">
          <div class="editor-dot"></div>
          <strong>novibe-editor</strong>
        </div>

        <button class="btn" id="runBtn">
          Exécuter
        </button>

      </div>

<textarea id="code"><!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mon site Novibe</title>

  <style>
    body{
      margin:0;
      background:#0b1220;
      color:white;
      font-family:Arial,sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
    }

    h1{
      font-size:50px;
      background:linear-gradient(135deg,#59f0ff,#cb6bff);
      -webkit-background-clip:text;
      color:transparent;
    }
  </style>
</head>

<body>

  <h1>Bienvenue sur Novibe</h1>

</body>
</html></textarea>

    </div>

    <!-- PREVIEW -->
    <div class="panel preview-container">

      <div class="browser-bar">

        <div class="browser-left">
          <div class="browser-logo"></div>

          <div class="browser-url">
            novibe://preview
          </div>
        </div>

        <strong style="font-size:.92rem;">
          Aperçu
        </strong>

      </div>

      <div id="previewContent" class="empty-preview">
        Clique sur "Exécuter" pour afficher ton site.
      </div>

    </div>

  </div>

</main>

<script>
  if(localStorage.getItem("novibe-auth") !== "true"){
    window.location.href = "/";
  }

  const code = document.getElementById("code");
  const preview = document.getElementById("previewContent");
  const runBtn = document.getElementById("runBtn");

  let running = false;

  runBtn.addEventListener("click", () => {

    if(!running){

      preview.innerHTML = `
        <iframe id="previewFrame"></iframe>
      `;

      const frame = document.getElementById("previewFrame");

      frame.srcdoc = code.value;

      runBtn.textContent = "Terminer";

      running = true;

    } else {

      preview.innerHTML = `
        Clique sur "Exécuter" pour afficher ton site.
      `;

      runBtn.textContent = "Exécuter";

      running = false;
    }

  });
</script>

</body>
</html>
