<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novibe — Editor</title>

  <style>
    :root{
      --bg:#070b14;
      --panel:rgba(255,255,255,.06);
      --line:rgba(255,255,255,.12);
      --text:#ffffff;
      --muted:rgba(255,255,255,.68);
      --cyan:#59f0ff;
      --blue:#5aa7ff;
      --violet:#cb6bff;
      --pink:#ff6bd6;
      --shadow:0 24px 60px rgba(0,0,0,.35);
      --radius-lg:24px;
    }

    *{
      box-sizing:border-box;
      min-width:0;
    }

    html,body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,system-ui,sans-serif;
      overflow-x:hidden;
      scroll-behavior:smooth;
    }

    body{
      background:
        radial-gradient(circle at 12% 12%, rgba(89,240,255,.22), transparent 24%),
        radial-gradient(circle at 82% 18%, rgba(203,107,255,.20), transparent 24%),
        radial-gradient(circle at 50% 75%, rgba(90,167,255,.14), transparent 30%),
        linear-gradient(180deg, #05070d 0%, #070b14 45%, #060913 100%);
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    @keyframes floaty {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 rgba(89,240,255,.18); }
      50% { box-shadow: 0 0 22px rgba(89,240,255,.34); }
      100% { box-shadow: 0 0 0 rgba(89,240,255,.18); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes softZoom {
      from { opacity: 0; transform: scale(.98); }
      to { opacity: 1; transform: scale(1); }
    }

    .wrap{
      min-height:100vh;
      position:relative;
      overflow-x:clip;
    }

    .glow{
      position:fixed;
      border-radius:999px;
      filter:blur(50px);
      pointer-events:none;
      z-index:0;
      opacity:.9;
    }

    .glow.one{
      top:-120px;
      left:-60px;
      width:360px;
      height:360px;
      background:rgba(89,240,255,.25);
    }

    .glow.two{
      bottom:-140px;
      right:-60px;
      width:420px;
      height:420px;
      background:rgba(203,107,255,.22);
    }

    .glow.three{
      top:30%;
      left:46%;
      width:300px;
      height:300px;
      background:rgba(90,167,255,.16);
    }

    .topbar{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      z-index:50;
      backdrop-filter:blur(10px);
      background:rgba(7,11,20,.58);
      border-bottom:1px solid var(--line);
    }

    .topbar-inner{
      width:min(1180px, calc(100% - 32px));
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      padding:18px 0;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:14px;
      animation:fadeUp .7s ease;
    }

    .logo{
      width:44px;
      height:44px;
      border-radius:16px;
      background:linear-gradient(135deg,var(--cyan),var(--violet));
      box-shadow:0 12px 36px rgba(89,240,255,.22);
      animation:floaty 5s ease-in-out infinite;
      flex:0 0 auto;
    }

    .brand h1{
      margin:0;
      font-size:1.4rem;
      line-height:1;
      letter-spacing:-.04em;
    }

    .brand p{
      margin:3px 0 0;
      color:var(--muted);
      font-size:.82rem;
    }

    .auth-buttons{
      display:flex;
      align-items:center;
      gap:12px;
      flex-wrap:nowrap;
      animation:fadeUp .7s ease;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      border:0;
      cursor:pointer;
      font-weight:800;
      border-radius:18px;
      padding:14px 20px;
      color:#071018;
      background:linear-gradient(135deg,var(--cyan),var(--blue));
      box-shadow:0 16px 40px rgba(89,240,255,.18);
      transition:transform .18s ease, filter .18s ease;
      white-space:nowrap;
      animation:pulseGlow 4s infinite;
    }

    .btn:hover{
      transform:translateY(-2px);
      filter:brightness(1.05);
    }

    .btn.secondary{
      color:#fff;
      background:rgba(255,255,255,.05);
      border:1px solid var(--line);
      box-shadow:none;
      backdrop-filter:blur(14px);
    }

    main{
      position:relative;
      z-index:2;
      padding-top:150px;
      padding-bottom:40px;
      width:min(1400px, calc(100% - 32px));
      margin:0 auto;
    }

    .editor-shell{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:28px;
      box-shadow:var(--shadow);
      overflow:hidden;
      backdrop-filter:blur(12px);
      animation:fadeUp .85s ease, softZoom .85s ease;
    }

    .toolbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:16px 18px;
      border-bottom:1px solid var(--line);
      background:rgba(255,255,255,.03);
      flex-wrap:wrap;
    }

    .tabs{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
      min-width:0;
    }

    .tabs.locked .tab{
      pointer-events:none;
      opacity:.55;
    }

    .tab{
      display:inline-flex;
      align-items:center;
      gap:10px;
      border:1px solid transparent;
      border-radius:16px 16px 10px 10px;
      padding:10px 14px;
      cursor:pointer;
      background:rgba(255,255,255,.04);
      color:rgba(255,255,255,.72);
      transition:.18s ease;
      font-size:.92rem;
      white-space:nowrap;
    }

    .tab:hover{
      background:rgba(255,255,255,.07);
      color:white;
    }

    .tab.active{
      background:linear-gradient(180deg, rgba(89,240,255,.18), rgba(255,255,255,.05));
      color:white;
      border-color:rgba(255,255,255,.10);
      box-shadow:0 10px 24px rgba(89,240,255,.10);
    }

    .tab-dot{
      width:10px;
      height:10px;
      border-radius:999px;
      background:linear-gradient(135deg,var(--cyan),var(--violet));
      flex:0 0 auto;
    }

    .actions{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .icon-btn{
      width:44px;
      height:44px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:14px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.05);
      color:white;
      font-size:1.2rem;
      cursor:pointer;
      transition:.18s ease;
    }

    .icon-btn:hover{
      transform:translateY(-2px);
      background:rgba(255,255,255,.08);
    }

    .icon-btn:disabled{
      opacity:.45;
      cursor:not-allowed;
      transform:none;
    }

    .workspace{
      height:78vh;
      position:relative;
    }

    .code-view,
    .preview-view{
      display:none;
      width:100%;
      height:100%;
    }

    .code-view.active,
    .preview-view.active{
      display:block;
    }

    textarea{
      width:100%;
      height:100%;
      border:none;
      outline:none;
      resize:none;
      background:transparent;
      color:white;
      padding:24px;
      font-size:15px;
      line-height:1.6;
      font-family:Consolas,monospace;
      display:block;
    }

    .preview{
      display:flex;
      flex-direction:column;
      width:100%;
      height:100%;
      background:#0b1220;
    }

    .browser-bar{
      height:62px;
      background:#0f172a;
      border-bottom:1px solid rgba(255,255,255,.08);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 16px;
      flex:0 0 auto;
    }

    .browser-left{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }

    .browser-icon{
      width:32px;
      height:32px;
      border-radius:10px;
      background:linear-gradient(135deg,var(--cyan),var(--violet));
      overflow:hidden;
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      color:white;
      font-size:.85rem;
    }

    .browser-icon img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:none;
    }

    .browser-name{
      display:flex;
      flex-direction:column;
      min-width:0;
    }

    .browser-name strong{
      color:white;
      font-size:.95rem;
      line-height:1;
    }

    .browser-name span{
      color:rgba(255,255,255,.58);
      font-size:.75rem;
      margin-top:4px;
    }

    .browser-url{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      padding:10px 14px;
      border-radius:12px;
      color:rgba(255,255,255,.72);
      font-size:.88rem;
      white-space:nowrap;
    }

    iframe{
      width:100%;
      height:100%;
      border:none;
      background:white;
      flex:1;
    }

    .status{
      padding:14px 18px;
      border-top:1px solid var(--line);
      color:var(--muted);
      font-size:.92rem;
    }

    .modal{
      position:fixed;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      background:rgba(0,0,0,.55);
      backdrop-filter:blur(8px);
      z-index:80;
      padding:20px;
    }

    .modal.show{
      display:flex;
    }

    .modal-card{
      width:min(520px,100%);
      background:rgba(10,14,24,.96);
      border:1px solid var(--line);
      border-radius:26px;
      box-shadow:var(--shadow);
      padding:22px;
    }

    .modal-card h3{
      margin:0 0 10px;
      font-size:1.35rem;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-top:14px;
    }

    .field input{
      width:100%;
      padding:14px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
      color:white;
      outline:none;
    }

    .modal-actions{
      display:flex;
      justify-content:flex-end;
      gap:10px;
      margin-top:18px;
    }

    .hint{
      margin-top:10px;
      color:var(--muted);
      font-size:.9rem;
      line-height:1.5;
    }

    @media(max-width:900px){
      .topbar-inner{
        flex-wrap:wrap;
        justify-content:center;
        text-align:center;
      }

      .auth-buttons{
        width:100%;
      }

      .auth-buttons .btn{
        flex:1;
      }

      .workspace{
        height:70vh;
      }

      .browser-url{
        display:none;
      }
    }
  </style>
</head>
<body>

<div class="wrap">
  <div class="glow one"></div>
  <div class="glow two"></div>
  <div class="glow three"></div>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo"></div>
        <div>
          <h1>Novibe</h1>
          <p>© Novibe Corporation</p>
        </div>
      </div>

      <div class="auth-buttons">
        <a class="btn secondary" href="/create">Créer</a>
        <button class="btn" id="logoutBtn">Déconnexion</button>
      </div>
    </div>
  </header>

  <main>
    <div class="editor-shell">

      <div class="toolbar">
        <div class="tabs" id="tabs"></div>

        <div class="actions">
          <button class="icon-btn" id="addFileBtn" title="Ajouter un fichier">+</button>
          <button class="btn" id="runBtn">Exécuter</button>
        </div>
      </div>

      <div class="workspace">

        <div class="code-view active" id="codeView">
          <textarea id="editor"></textarea>
        </div>

        <div class="preview-view" id="previewView">
          <div class="preview">
            <div class="browser-bar">
              <div class="browser-left">
                <div class="browser-icon">
                  <img id="siteIconImg" alt="logo du site">
                  <span id="siteIconFallback">N</span>
                </div>

                <div class="browser-name">
                  <strong id="siteTitle">Mon site</strong>
                  <span>Aperçu du projet</span>
                </div>
              </div>

              <div class="browser-url" id="browserUrl">index.html</div>
            </div>

            <iframe id="frame"></iframe>
          </div>
        </div>

      </div>

      <div class="status" id="status">
        Éditeur prêt.
      </div>

    </div>
  </main>
</div>

<div class="modal" id="modal">
  <div class="modal-card">

    <h3>Ajouter un fichier</h3>

    <div class="field">
      <label>Nom du fichier</label>
      <input id="fileName" placeholder="style.css">
    </div>

    <div class="modal-actions">
      <button class="btn secondary" id="cancelBtn">Annuler</button>
      <button class="btn" id="createBtn">Créer</button>
    </div>

    <div class="hint">
      Les fichiers exécutables sont les fichiers HTML. Les fichiers CSS et les images peuvent être ajoutés au projet, mais ils ne s’exécutent pas seuls.
    </div>
  </div>
</div>

<script>
  if (localStorage.getItem("novibe-auth") !== "true") {
    location.href = "/";
  }

  const files = {
    "index.html": `<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mon site Novibe</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:#0b1220;
  color:white;
  font-family:Arial,sans-serif;
}

h1{
  font-size:52px;
  margin:0;
  background:linear-gradient(135deg,#59f0ff,#cb6bff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

p{
  color:rgba(255,255,255,.7);
  margin-top:14px;
}
</style>
</head>

<body>
<h1>Bienvenue</h1>
<p>Ton projet Novibe fonctionne.</p>
</body>
</html>`
  };

  let activeFile = "index.html";
  let previewMode = false;

  const tabs = document.getElementById("tabs");
  const editor = document.getElementById("editor");
  const codeView = document.getElementById("codeView");
  const previewView = document.getElementById("previewView");
  const frame = document.getElementById("frame");
  const runBtn = document.getElementById("runBtn");
  const status = document.getElementById("status");

  const siteTitle = document.getElementById("siteTitle");
  const browserUrl = document.getElementById("browserUrl");
  const siteIconImg = document.getElementById("siteIconImg");
  const siteIconFallback = document.getElementById("siteIconFallback");

  const addFileBtn = document.getElementById("addFileBtn");
  const modal = document.getElementById("modal");
  const fileName = document.getElementById("fileName");
  const cancelBtn = document.getElementById("cancelBtn");
  const createBtn = document.getElementById("createBtn");

  const logoutBtn = document.getElementById("logoutBtn");

  function setStatus(text, color) {
    status.textContent = text;
    if (color) status.style.color = color;
  }

  function isHtmlFile(fileName) {
    return /\.html?$/i.test(fileName);
  }

  function isCssFile(fileName) {
    return /\.css$/i.test(fileName);
  }

  function isImageFile(fileName) {
    return /\.(png|jpe?g|gif|webp|svg)$/i.test(fileName);
  }

  function saveCurrent() {
    if (files[activeFile] && files[activeFile].type === "html") {
      files[activeFile].content = editor.value;
    }
  }

  function renderTabs() {
    tabs.innerHTML = "";

    Object.keys(files).forEach((file) => {
      const tab = document.createElement("button");
      tab.type = "button";
      tab.className = "tab" + (file === activeFile ? " active" : "");
      tab.innerHTML = `<span class="tab-dot"></span>${file}`;

      tab.addEventListener("click", () => {
        if (previewMode) return;

        activeFile = file;
        editor.value = files[file].content || "";
        renderTabs();
        updateCodeBar();
        setStatus(`Ouvert : ${file}`, "#59f0ff");
      });

      tabs.appendChild(tab);
    });
  }

  function updateCodeBar() {
    const file = files[activeFile];
    browserUrl.textContent = activeFile;
    siteTitle.textContent = activeFile;

    if (file && file.type === "html") {
      siteIconImg.style.display = "none";
      siteIconFallback.style.display = "block";
      siteIconFallback.textContent = "N";
    } else if (file && file.type === "image") {
      siteIconImg.src = file.content;
      siteIconImg.style.display = "block";
      siteIconFallback.style.display = "none";
    } else {
      siteIconImg.style.display = "none";
      siteIconFallback.style.display = "block";
      siteIconFallback.textContent = "N";
    }
  }

  function extractTitle(html) {
    const match = html.match(/<title>([\s\S]*?)<\/title>/i);
    return match ? match[1].trim() : "Novibe";
  }

  function extractIcon(html) {
    const match = html.match(/<link[^>]+rel=["'][^"']*icon[^"']*["'][^>]*href=["']([^"']+)["']/i);
    return match ? match[1].trim() : "";
  }

  function buildPreviewHtml(html) {
    let output = html;

    let cssBundle = "";
    let jsBundle = "";

    Object.entries(files).forEach(([name, file]) => {
      if (file.type === "css") {
        cssBundle += `\n/* ${name} */\n${file.content}\n`;
      } else if (file.type === "js") {
        jsBundle += `\n// ${name}\n${file.content}\n`;
      }
    });

    if (cssBundle.trim()) {
      const cssTag = `<style id="novibe-inline-css">\n${cssBundle}\n</style>`;
      if (/<\/head>/i.test(output)) {
        output = output.replace(/<\/head>/i, cssTag + "\n</head>");
      } else {
        output = cssTag + "\n" + output;
      }
    }

    if (jsBundle.trim()) {
      const jsTag = `<script id="novibe-inline-js">\n${jsBundle}\n<\/script>`;
      if (/<\/body>/i.test(output)) {
        output = output.replace(/<\/body>/i, jsTag + "\n</body>");
      } else {
        output += "\n" + jsTag;
      }
    }

    Object.entries(files).forEach(([name, file]) => {
      if (file.type !== "image") return;

      const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const dataUrl = file.content;

      output = output.replace(
        new RegExp(`(src|href)=([\"'])${escaped}\\2`, "gi"),
        `$1=$2${dataUrl}$2`
      );

      output = output.replace(
        new RegExp(`url\\(([\"'])?${escaped}\\1?\\)`, "gi"),
        `url("${dataUrl}")`
      );
    });

    return output;
  }

  function updatePreviewBar(htmlFileName, html) {
    const title = extractTitle(html);
    const icon = extractIcon(html);

    siteTitle.textContent = title;
    browserUrl.textContent = htmlFileName;

    if (icon) {
      siteIconImg.src = icon;
      siteIconImg.style.display = "block";
      siteIconFallback.style.display = "none";
    } else {
      siteIconImg.removeAttribute("src");
      siteIconImg.style.display = "none";
      siteIconFallback.style.display = "block";
      siteIconFallback.textContent = title.charAt(0).toUpperCase() || "N";
    }
  }

  function setPreviewLock(lock) {
    tabs.classList.toggle("locked", lock);
    addFileBtn.disabled = lock;
  }

  function runPreview() {
    saveCurrent();

    const current = files[activeFile];

    if (!current || current.type !== "html") {
      setStatus("Seuls les fichiers HTML peuvent être exécutés.", "#ff6bd6");
      return;
    }

    const html = buildPreviewHtml(current.content);

    updatePreviewBar(activeFile, html);

    frame.srcdoc = html;

    codeView.classList.remove("active");
    previewView.classList.add("active");

    previewMode = true;
    runBtn.textContent = "Terminer";
    setStatus("Aperçu affiché.", "#59f0ff");
    setPreviewLock(true);
  }

  function stopPreview() {
    previewMode = false;
    previewView.classList.remove("active");
    codeView.classList.add("active");
    runBtn.textContent = "Exécuter";
    setPreviewLock(false);
    editor.value = files[activeFile].content || "";
    updateCodeBar();
    setStatus("Retour au code.", "#cb6bff");
  }

  runBtn.addEventListener("click", () => {
    if (previewMode) {
      stopPreview();
    } else {
      runPreview();
    }
  });

  addFileBtn.addEventListener("click", () => {
    if (previewMode) return;

    modal.classList.add("show");
    fileName.value = "";
    fileName.focus();
  });

  cancelBtn.addEventListener("click", () => {
    modal.classList.remove("show");
  });

  function detectFileType(name) {
    if (isHtmlFile(name)) return "html";
    if (isCssFile(name)) return "css";
    if (isImageFile(name)) return "image";
    if (/\.js$/i.test(name)) return "js";
    return "text";
  }

  createBtn.addEventListener("click", () => {
    const name = fileName.value.trim();

    if (!name) {
      setStatus("Nom de fichier invalide.", "#ff6bd6");
      return;
    }

    if (files[name]) {
      setStatus("Ce fichier existe déjà.", "#ff6bd6");
      return;
    }

    const type = detectFileType(name);

    files[name] = {
      type,
      content:
        type === "html"
          ? "<!DOCTYPE html>\n<html>\n<head>\n<title>Nouveau fichier</title>\n</head>\n<body>\n\n</body>\n</html>"
          : ""
    };

    activeFile = name;

    editor.value = files[name].content;

    renderTabs();
    updateCodeBar();

    modal.classList.remove("show");

    setStatus(`Fichier créé : ${name}`, "#59f0ff");
  });

  editor.addEventListener("input", () => {
    if (!files[activeFile]) return;

    files[activeFile].content = editor.value;
  });

  logoutBtn.addEventListener("click", () => {
    localStorage.removeItem("novibe-auth");
    location.href = "/";
  });

  window.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
      e.preventDefault();

      saveCurrent();

      setStatus("Projet sauvegardé localement.", "#59f0ff");
    }
  });

  renderTabs();

  editor.value = files[activeFile].content;

  updateCodeBar();
