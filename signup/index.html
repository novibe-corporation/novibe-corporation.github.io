<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inscription - Novibe</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #070b14;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      width: 90%;
      max-width: 420px;
      padding: 30px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      backdrop-filter: blur(12px);
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.3);
      color: white;
      outline: none;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #59f0ff, #5aa7ff);
      font-weight: bold;
      cursor: pointer;
    }

    .msg {
      margin-top: 15px;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>Créer un compte</h1>

  <input type="email" id="email" placeholder="Email" />
  <input type="password" id="password" placeholder="Mot de passe" />

  <button id="signup">S'inscrire</button>

  <div class="msg" id="msg"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDdMYtSr2FeNGay_Nwv8oLMXg7WVQspOJ8",
    authDomain: "novibe-a5c1f.firebaseapp.com",
    projectId: "novibe-a5c1f",
    storageBucket: "novibe-a5c1f.firebasestorage.app",
    messagingSenderId: "312673438609",
    appId: "1:312673438609:web:2fbf719814a6c8c61a2830"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const email = document.getElementById("email");
  const password = document.getElementById("password");
  const msg = document.getElementById("msg");

  document.getElementById("signup").addEventListener("click", async () => {
    try {
      await createUserWithEmailAndPassword(auth, email.value, password.value);

      msg.textContent = "✔ Compte créé avec succès !";
      setTimeout(() => location.href = "/", 1200);

    } catch (e) {
      msg.textContent = "Erreur : " + e.message;
    }
  });
</script>

</body>
</html>
