<!DOCTYPE html><html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscription</title>  <style>
    :root{
      --bg:#070b14;
      --panel:rgba(255,255,255,.06);
      --line:rgba(255,255,255,.12);
      --text:#fff;
      --muted:rgba(255,255,255,.7);
      --cyan:#59f0ff;
      --violet:#cb6bff;
      --blue:#5aa7ff;
      --radius:22px;
    }

    *{box-sizing:border-box;font-family:system-ui,sans-serif;}

    body{
      margin:0;
      background: radial-gradient(circle at 20% 20%, rgba(89,240,255,.18), transparent 30%),
                  radial-gradient(circle at 80% 30%, rgba(203,107,255,.18), transparent 35%),
                  var(--bg);
      color:var(--text);
    }

    a{color:inherit;text-decoration:none}

    .topbar{
      position:fixed;top:0;left:0;right:0;
      display:flex;justify-content:space-between;align-items:center;
      padding:16px 22px;
      background:rgba(7,11,20,.7);
      backdrop-filter:blur(12px);
      border-bottom:1px solid var(--line);
    }

    .brand{font-weight:800;letter-spacing:-.03em}

    .container{
      display:grid;
      grid-template-columns:1fr 1fr;
      min-height:100vh;
      padding-top:80px;
    }

    .left{
      padding:60px;
    }

    .left h1{
      font-size:3rem;
      margin:0;
      line-height:1;
    }

    .left p{
      color:var(--muted);
      margin-top:16px;
      max-width:500px;
      line-height:1.6;
    }

    .right{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:40px;
    }

    .card{
      width:100%;
      max-width:420px;
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:28px;
      backdrop-filter:blur(12px);
    }

    input{
      width:100%;
      padding:14px;
      margin-top:12px;
      border-radius:14px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.05);
      color:#fff;
      outline:none;
    }

    button{
      width:100%;
      margin-top:18px;
      padding:14px;
      border:none;
      border-radius:14px;
      font-weight:800;
      cursor:pointer;
      background:linear-gradient(135deg,var(--cyan),var(--blue));
    }

    .lang{
      display:flex;gap:10px;align-items:center;
    }

    select{
      background:rgba(255,255,255,.05);
      color:#fff;
      border:1px solid var(--line);
      padding:8px 10px;
      border-radius:10px;
    }
  </style></head><body><div class="topbar">
  <div class="brand">Novibe</div>
  <div class="lang">
    <select id="lang">
      <option value="fr">FR</option>
      <option value="en">EN</option>
    </select>
  </div>
</div><div class="container">  <div class="left">
    <h1 id="title">Inscription</h1>
    <p id="desc">Crée ton compte pour accéder à la plateforme.</p>
  </div>  <div class="right">
    <div class="card">
      <input id="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Mot de passe" />
      <input id="confirm" type="password" placeholder="Confirmer" />
      <button id="signupBtn">Créer un compte</button>
    </div>
  </div></div><script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDdMYtSr2FeNGay_Nwv8oLMXg7WVQspOJ8",
  authDomain: "novibe-a5c1f.firebaseapp.com",
  projectId: "novibe-a5c1f",
  storageBucket: "novibe-a5c1f.firebasestorage.app",
  messagingSenderId: "312673438609",
  appId: "1:312673438609:web:2fbf719814a6c8c61a2830"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const i18n = {
  fr:{
    title:"Inscription",
    desc:"Crée ton compte pour accéder à la plateforme.",
    email:"Email",
    pass:"Mot de passe",
    confirm:"Confirmer",
    btn:"Créer un compte"
  },
  en:{
    title:"Sign up",
    desc:"Create your account to access the platform.",
    email:"Email",
    pass:"Password",
    confirm:"Confirm",
    btn:"Create account"
  }
};

function setLang(l){
  document.getElementById("title").innerText=i18n[l].title;
  document.getElementById("desc").innerText=i18n[l].desc;
  document.getElementById("email").placeholder=i18n[l].email;
  document.getElementById("password").placeholder=i18n[l].pass;
  document.getElementById("confirm").placeholder=i18n[l].confirm;
  document.getElementById("signupBtn").innerText=i18n[l].btn;
  localStorage.setItem("lang",l);
}

const langSelect=document.getElementById("lang");
langSelect.addEventListener("change",e=>setLang(e.target.value));

setLang(localStorage.getItem("lang")||"fr");

signupBtn.onclick=async()=>{
  const email=email.value;
  const pass=password.value;
  const confirm=confirm.value;

  if(pass!==confirm){
    alert("Passwords do not match");
    return;
  }

  try{
    await createUserWithEmailAndPassword(auth,email,pass);
    window.location.href="/";
  }catch(e){
    alert(e.message);
  }
};
</script></body>
</html>
