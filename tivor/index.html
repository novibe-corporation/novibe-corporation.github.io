<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nexio – Moteur de recherche</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>

  <!-- Fond animé -->
  <div class="background bg-default"></div>

  <!-- Bouton paramètres -->
  <button class="settings-btn" id="settingsBtn">⚙️</button>

  <!-- Menu paramètres -->
  <aside class="settings-panel" id="settingsPanel" aria-hidden="true">
    <h3>Paramètres</h3>

    <div class="settings-item">
      <label for="bgSelect">Style du fond</label>
      <select id="bgSelect">
        <option value="default">Dégradé par défaut</option>
        <option value="blue">Bleu océan</option>
        <option value="purple">Violet néon</option>
        <option value="sunset">Coucher de soleil</option>
      </select>
    </div>

    <div class="settings-item">
      <label for="motionToggle">Animations</label>
      <button id="motionToggle" class="settings-btn-toggle" aria-pressed="true">
        Activées
      </button>
    </div>
  </aside>

  <main class="container">
    <header class="brand">
      <div class="logo-icon">N</div>
      <h1 class="logo-text fade-in">Nexio</h1>
    </header>

    <form class="search-box" id="searchForm">
      <input id="searchInput" class="search-input fade-in" type="search" placeholder="Rechercher sur Nexio…" autocomplete="off" />
      <button type="submit" class="btn">Rechercher</button>
    </form>

    <section class="results" id="results"></section>
  </main>

  <script src="../app.js"></script>
</body>
</html>
