<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tivor – Moteur de recherche</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background" aria-hidden="true"></div>

  <main class="container" role="main">
    <header class="brand" aria-label="Tivor">
      <div class="logo-icon" aria-hidden="true">T</div>
      <h1 class="logo-text">Tivor</h1>
    </header>

    <form class="search-box" id="searchForm" role="search" aria-label="Recherche Tivor">
      <label for="searchInput" class="visually-hidden">Rechercher</label>
      <input id="searchInput" class="search-input" type="search" placeholder="Rechercher sur Tivor…" autocomplete="off" />
      <button type="submit" class="btn" id="searchBtn">Rechercher</button>
    </form>

    <section class="results" id="results" aria-live="polite"></section>
  </main>

  <script>
    const form = document.getElementById('searchForm');
    const input = document.getElementById('searchInput');
    const results = document.getElementById('results');

    function renderFakeResults(q) {
      results.innerHTML = '';
      if (!q.trim()) {
        results.innerHTML = '';
        return;
      }
      const items = [
        { title: `Résultats pour « ${q} »`, url: `https://tivor.example/search?q=${encodeURIComponent(q)}`, snippet: 'Tivor — recherche fluide et élégante.' },
        { title: 'À propos de Tivor', url: 'https://tivor.example/about', snippet: 'Moteur de recherche professionnel et animé.' }
      ];
      items.forEach((r, i) => {
        const el = document.createElement('article');
        el.className = 'result';
        el.style.animationDelay = `${i * 60}ms`;
        el.innerHTML = `
          <div class="result-title">${r.title}</div>
          <div class="result-url">${r.url}</div>
          <div class="result-snippet">${r.snippet}</div>
        `;
        results.appendChild(el);
      });
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      renderFakeResults(input.value);
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Escape') input.value = '';
    });
  </script>
</body>
</html>
