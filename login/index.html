<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion – Novibe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Inter, sans-serif;
      background: linear-gradient(135deg, #0a0f1f, #111a33);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      padding: 40px;
      border-radius: 16px;
      width: 350px;
      box-shadow: 0 0 25px rgba(0,0,0,0.4);
      animation: fadeIn .6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      margin-top: 0;
      text-align: center;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
      border: none;
      outline: none;
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #4c6fff;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #6d86ff;
    }

    .error {
      margin-top: 15px;
      color: #ff6b6b;
      font-size: 14px;
      text-align: center;
      min-height: 20px;
    }

    .link {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
    }

    .link a {
      color: #7aa2ff;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>Connexion</h2>

    <input id="email" type="email" placeholder="Adresse email">
    <input id="password" type="password" placeholder="Mot de passe">

    <button id="loginBtn">Se connecter</button>

    <div class="error" id="errorBox"></div>

    <div class="link">
      Pas de compte ? <a href="/signup">Créer un compte</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDdMYtSr2FeNGay_Nwv8oLMXg7WVQspOJ8",
      authDomain: "novibe-a5c1f.firebaseapp.com",
      projectId: "novibe-a5c1f",
      storageBucket: "novibe-a5c1f.firebasestorage.app",
      messagingSenderId: "312673438609",
      appId: "1:312673438609:web:2fbf719814a6c8c61a2830"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginBtn = document.getElementById("loginBtn");
    const errorBox = document.getElementById("errorBox");

    loginBtn.addEventListener("click", () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      signInWithEmailAndPassword(auth, email, password)
        .then(() => {
          window.location.href = "/dashboard"; // Change si besoin
        })
        .catch((error) => {
          errorBox.textContent = "Erreur : " + error.message;
        });
    });
  </script>

</body>
</html>
