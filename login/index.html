<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Novibe — Login</title>

  <style>
    :root {
      --bg:#070b14;
      --panel:rgba(255,255,255,.06);
      --line:rgba(255,255,255,.12);
      --text:#fff;
      --muted:rgba(255,255,255,.68);
      --cyan:#59f0ff;
      --blue:#5aa7ff;
      --violet:#cb6bff;
      --shadow:0 24px 60px rgba(0,0,0,.35);
    }

    *{box-sizing:border-box;min-width:0}

    body{
      margin:0;
      font-family:system-ui,Segoe UI,Arial;
      color:var(--text);
      background:
        radial-gradient(circle at 12% 12%, rgba(89,240,255,.22), transparent 24%),
        radial-gradient(circle at 82% 18%, rgba(203,107,255,.20), transparent 24%),
        linear-gradient(180deg,#05070d,#070b14);
      overflow-x:hidden;
    }

    @keyframes fadeUp{
      from{opacity:0;transform:translateY(24px)}
      to{opacity:1;transform:translateY(0)}
    }

    @keyframes floating{
      0%{transform:translateY(0)}
      50%{transform:translateY(-10px)}
      100%{transform:translateY(0)}
    }

    .wrap{min-height:100vh}

    .glow{
      position:fixed;
      border-radius:999px;
      filter:blur(50px);
      opacity:.85;
      z-index:0;
      animation:floating 8s infinite;
    }
    .glow.one{top:-120px;left:-60px;width:360px;height:360px;background:rgba(89,240,255,.25)}
    .glow.two{bottom:-140px;right:-60px;width:420px;height:420px;background:rgba(203,107,255,.22)}

    /* TOPBAR CORRIGÉE (bouton ajouté) */
    .topbar{
      position:fixed;
      top:0;left:0;
      width:100%;
      z-index:20;
      backdrop-filter:blur(10px);
      background:rgba(7,11,20,.58);
      border-bottom:1px solid var(--line);
    }

    .topbar-inner{
      width:min(1180px,calc(100% - 32px));
      margin:0 auto;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:18px 0;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .logo{
      width:44px;height:44px;
      border-radius:16px;
      background:linear-gradient(135deg,var(--cyan),var(--violet));
      animation:floating 5s infinite;
    }

    .btn-top{
      padding:10px 16px;
      border-radius:14px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.06);
      color:white;
      text-decoration:none;
      font-weight:600;
      transition:.2s;
    }

    .btn-top:hover{
      background:rgba(255,255,255,.12);
    }

    main{
      padding-top:110px;
    }

    /* GRID FIX */
    .login-grid{
      display:grid;
      grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);
      gap:22px;
      width:min(1180px,calc(100% - 32px));
      margin:0 auto;
      padding:64px 0;
      align-items:stretch;
    }

    .hero-card,.form-card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:34px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
      animation:fadeUp .8s ease;
    }

    .hero-card{
      padding:34px;
      position:relative;
      overflow:hidden;
    }

    .hero-card h2{
      margin:0;
      font-size:clamp(2.4rem,5vw,4.5rem);
      line-height:.95;
      letter-spacing:-.06em;
    }

    .grad{
      background:linear-gradient(135deg,#fff,var(--cyan),var(--violet));
      -webkit-background-clip:text;
      color:transparent;
    }

    .form-card{
      padding:30px;
    }

    .field{
      display:grid;
      gap:8px;
      margin-top:16px;
    }

    input{
      padding:15px 16px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
      color:#fff;
      outline:none;
    }

    input:focus{
      border-color:rgba(89,240,255,.5);
      box-shadow:0 0 0 3px rgba(89,240,255,.12);
    }

    .btn{
      width:100%;
      margin-top:18px;
      padding:14px;
      border:none;
      border-radius:16px;
      font-weight:800;
      cursor:pointer;
      background:linear-gradient(135deg,var(--cyan),var(--blue));
      color:#071018;
    }

    .btn.secondary{
      background:rgba(255,255,255,.06);
      border:1px solid var(--line);
      color:#fff;
      margin-top:10px;
    }

    .message{
      margin-top:14px;
      padding:14px;
      border-radius:16px;
      border:1px solid var(--line);
      color:var(--muted);
      min-height:50px;
    }

    .lang{
      margin-top:14px;
      display:flex;
      justify-content:center;
      gap:10px;
    }

    select{
      padding:10px;
      border-radius:12px;
      background:rgba(255,255,255,.08);
      color:#fff;
      border:1px solid var(--line);
    }

    @media(max-width:980px){
      .login-grid{grid-template-columns:1fr}
    }
  </style>
</head>

<body>
<div class="wrap">
  <div class="glow one"></div>
  <div class="glow two"></div>

  <!-- TOPBAR FIX -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo"></div>
        <strong>Novibe</strong>
      </div>

      <div style="display:flex;gap:10px">
        <a class="btn-top" href="/signup">Inscription</a>
        <a class="btn-top" href="/">Accueil</a>
      </div>
    </div>
  </header>

  <main>
    <section class="login-grid">

      <!-- HERO -->
      <div class="hero-card">
        <h2><span class="grad">Connexion</span><br>à Novibe</h2>
        <p style="color:var(--muted);line-height:1.7">
          Accède à ton compte et retrouve ton espace utilisateur.
        </p>
      </div>

      <!-- FORM -->
      <div class="form-card">

        <div class="field">
          <label>Email</label>
          <input id="email" type="email"/>
        </div>

        <div class="field">
          <label>Mot de passe</label>
          <input id="password" type="password"/>
        </div>

        <button class="btn" id="loginBtn">Se connecter</button>
        <a class="btn secondary" href="/signup">Créer un compte</a>

        <div class="message" id="msg">...</div>

        <div class="lang">
          <span>Langue</span>
          <select id="lang">
            <option>FR</option>
            <option>EN</option>
          </select>
        </div>

      </div>

    </section>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const app = initializeApp({
  apiKey:"AIzaSyDdMYtSr2FeNGay_Nwv8oLMXg7WVQspOJ8",
  authDomain:"novibe-a5c1f.firebaseapp.com",
  projectId:"novibe-a5c1f",
  storageBucket:"novibe-a5c1f.firebasestorage.app",
  messagingSenderId:"312673438609",
  appId:"1:312673438609:web:2fbf719814a6c8c61a2830"
});

const auth = getAuth(app);

const els={
  email:document.getElementById("email"),
  password:document.getElementById("password"),
  msg:document.getElementById("msg"),
  btn:document.getElementById("loginBtn")
};

els.btn.onclick=async()=>{
  try{
    await signInWithEmailAndPassword(auth,els.email.value,els.password.value);
    els.msg.textContent="Connexion réussie";
    setTimeout(()=>location.href="/",1000);
  }catch(e){
    els.msg.textContent="Erreur";
  }
};
</script>

</body>
</html>
