<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novibe — Login</title>

  <style>
    :root {
      --bg: #070b14;
      --panel: rgba(255,255,255,.06);
      --line: rgba(255,255,255,.12);
      --text: #ffffff;
      --muted: rgba(255,255,255,.68);
      --cyan: #59f0ff;
      --blue: #5aa7ff;
      --violet: #cb6bff;
      --pink: #ff6bd6;
      --shadow: 0 24px 60px rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 12%, rgba(89,240,255,.22), transparent 24%),
        radial-gradient(circle at 82% 18%, rgba(203,107,255,.20), transparent 24%),
        linear-gradient(180deg, #05070d 0%, #070b14 100%);
    }

    a { color: inherit; text-decoration: none; }

    /* TOPBAR */
    .topbar {
      position: fixed;
      top: 0;
      width: 100%;
      backdrop-filter: blur(10px);
      background: rgba(7,11,20,.6);
      border-bottom: 1px solid var(--line);
      z-index: 10;
    }

    .topbar-inner {
      width: min(1180px, calc(100% - 32px));
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 0;
    }

    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--cyan), var(--violet));
    }

    .btn {
      padding: 12px 18px;
      border-radius: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: #071018;
      transition: .2s;
    }

    .btn:hover { transform: translateY(-2px); }

    .btn.secondary {
      background: rgba(255,255,255,.06);
      border: 1px solid var(--line);
      color: white;
    }

    /* LAYOUT */
    main {
      padding-top: 110px;
    }

    .container {
      width: min(1100px, calc(100% - 32px));
      margin: auto;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      padding: 60px 0;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 30px;
    }

    h2 { margin: 0 0 10px; }
    p { color: var(--muted); }

    /* FORM */
    .field {
      display: grid;
      gap: 8px;
      margin-top: 16px;
    }

    input {
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.05);
      color: white;
      outline: none;
    }

    input:focus {
      border-color: rgba(89,240,255,.6);
    }

    .actions {
      margin-top: 18px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .msg {
      margin-top: 15px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--line);
      color: var(--muted);
      min-height: 40px;
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">

    <div class="brand">
      <div class="logo"></div>
      <div>
        <strong>Novibe</strong><br>
        <small style="color:rgba(255,255,255,.6)">Login</small>
      </div>
    </div>

    <div style="display:flex; gap:10px;">
      <a class="btn secondary" href="/">Accueil</a>
      <a class="btn" href="/signup">Inscription</a>
    </div>

  </div>
</header>

<main class="container">

  <div class="grid">

    <!-- LEFT -->
    <div class="card">
      <h2>Connexion à Novibe</h2>
      <p>Accède à ton compte et retrouve ton espace.</p>

      <p style="margin-top:20px; color:rgba(255,255,255,.6)">
        Interface cohérente avec Signup, design glass + gradients.
      </p>
    </div>

    <!-- RIGHT FORM -->
    <div class="card">

      <h2>Login</h2>
      <p>Entre tes identifiants</p>

      <div class="field">
        <label>Email</label>
        <input id="email" type="email" placeholder="email@exemple.com">
      </div>

      <div class="field">
        <label>Mot de passe</label>
        <input id="password" type="password" placeholder="••••••••">
      </div>

      <div class="actions">
        <button id="loginBtn" class="btn">Se connecter</button>
        <a class="btn secondary" href="/signup">Créer un compte</a>
      </div>

      <div id="msg" class="msg">Connecte-toi pour continuer.</div>

    </div>

  </div>

</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDdMYtSr2FeNGay_Nwv8oLMXg7WVQspOJ8",
  authDomain: "novibe-a5c1f.firebaseapp.com",
  projectId: "novibe-a5c1f",
  storageBucket: "novibe-a5c1f.firebasestorage.app",
  messagingSenderId: "312673438609",
  appId: "1:312673438609:web:2fbf719814a6c8c61a2830"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const email = document.getElementById("email");
const password = document.getElementById("password");
const msg = document.getElementById("msg");

document.getElementById("loginBtn").addEventListener("click", async () => {
  try {
    msg.textContent = "Connexion...";
    await signInWithEmailAndPassword(auth, email.value, password.value);

    msg.textContent = "Connexion réussie ✔ Redirection...";
    setTimeout(() => {
      window.location.href = "/";
    }, 1000);

  } catch (e) {
    msg.textContent = "Erreur : " + e.message;
  }
});
</script>

</body>
</html>
