<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Novibe — Login</title>

  <style>
    :root {
      --bg: #070b14;
      --panel: rgba(255,255,255,.06);
      --line: rgba(255,255,255,.12);
      --text: #fff;
      --muted: rgba(255,255,255,.65);
      --cyan: #59f0ff;
      --violet: #cb6bff;
      --blue: #5aa7ff;
      --radius: 22px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(89,240,255,.15), transparent 40%),
                  radial-gradient(circle at 80% 30%, rgba(203,107,255,.12), transparent 40%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }

    /* TOP BAR (copié de /home) */
    .topbar {
      position: fixed;
      top: 0;
      width: 100%;
      backdrop-filter: blur(12px);
      background: rgba(7,11,20,.7);
      border-bottom: 1px solid var(--line);
      z-index: 10;
    }

    .topbar-inner {
      max-width: 1100px;
      margin: auto;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .logout {
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.05);
      cursor: pointer;
      color: white;
    }

    /* MAIN */
    .container {
      max-width: 1100px;
      margin: auto;
      padding: 110px 20px 40px;
    }

    .title {
      font-size: 2.4rem;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 30px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 40px rgba(0,0,0,.45);
      max-width: 420px;
    }

    .field {
      display: grid;
      gap: 6px;
      margin-top: 14px;
    }

    .field label {
      font-size: .9rem;
      color: rgba(255,255,255,.8);
    }

    .field input {
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.06);
      color: white;
      outline: none;
      font-size: .98rem;
    }

    .field input:focus {
      border-color: rgba(89,240,255,.7);
      box-shadow: 0 0 0 2px rgba(89,240,255,.25);
    }

    .btn {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: #000;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    .btn.secondary {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      margin-left: 8px;
    }

    .message {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      color: var(--muted);
      font-size: .9rem;
      min-height: 40px;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      color: var(--muted);
      font-size: .9rem;
    }
  </style>
</head>

<body>

<div class="wrap">

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">Novibe</div>
      <div>
        <a class="logout" href="/">Accueil</a>
      </div>
    </div>
  </header>

  <div class="container">

    <div class="title">Connexion</div>
    <div class="subtitle">Connecte-toi pour accéder à ton espace Novibe.</div>

    <div class="card">
      <div class="field">
        <label for="email">Adresse email</label>
        <input id="email" type="email" placeholder="exemple@email.com" />
      </div>

      <div class="field">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" placeholder="Ton mot de passe" />
      </div>

      <button id="loginBtn" class="btn">Se connecter</button>
      <a class="btn secondary" href="/signup">Créer un compte</a>

      <div id="message" class="message">Entre tes identifiants pour te connecter.</div>
    </div>

    <footer>
      © Novibe Corporation — Login sécurisé
    </footer>

  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDdMYtSr2FeNGay_Nwv8oLMXg7WVQspOJ8",
    authDomain: "novibe-a5c1f.firebaseapp.com",
    projectId: "novibe-a5c1f",
    storageBucket: "novibe-a5c1f.firebasestorage.app",
    messagingSenderId: "312673438609",
    appId: "1:312673438609:web:2fbf719814a6c8c61a2830"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const emailEl = document.getElementById("email");
  const passwordEl = document.getElementById("password");
  const loginBtn = document.getElementById("loginBtn");
  const messageEl = document.getElementById("message");

  function setMessage(text, isError = false) {
    messageEl.textContent = text;
    messageEl.style.color = isError ? "#ff6b6b" : "var(--muted)";
    messageEl.style.borderColor = isError ? "rgba(255,107,107,.35)" : "rgba(255,255,255,.12)";
  }

  loginBtn.addEventListener("click", async () => {
    const email = emailEl.value.trim();
    const pass = passwordEl.value;

    if (!email || !pass) {
      setMessage("Remplis tous les champs.", true);
      return;
    }

    setMessage("Connexion en cours...");
    loginBtn.disabled = true;
    loginBtn.textContent = "Connexion...";

    try {
      await signInWithEmailAndPassword(auth, email, pass);
      localStorage.setItem("novibe-auth", "true");
      setMessage("Connecté. Redirection...");
      setTimeout(() => {
        window.location.href = "/home";
      }, 1000);
    } catch (error) {
      setMessage(error?.message || "Une erreur est survenue.", true);
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = "Se connecter";
    }
  });
</script>

</body>
</html>
