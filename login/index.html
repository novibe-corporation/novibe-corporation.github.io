<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novibe — Login</title>

  <style>
    :root {
      --bg: #070b14;
      --panel: rgba(255,255,255,.06);
      --line: rgba(255,255,255,.12);
      --text: #ffffff;
      --muted: rgba(255,255,255,.68);
      --cyan: #59f0ff;
      --blue: #5aa7ff;
      --violet: #cb6bff;
      --pink: #ff6bd6;
      --shadow: 0 24px 60px rgba(0,0,0,.35);
      --radius-xl: 34px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background:
        radial-gradient(circle at 12% 12%, rgba(89,240,255,.22), transparent 24%),
        radial-gradient(circle at 82% 18%, rgba(203,107,255,.20), transparent 24%),
        radial-gradient(circle at 50% 75%, rgba(90,167,255,.14), transparent 30%),
        linear-gradient(180deg, #05070d 0%, #070b14 45%, #060913 100%);
      color: var(--text);
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes floating {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }

    /* GLOW */
    .glow {
      position: fixed;
      border-radius: 999px;
      filter: blur(50px);
      pointer-events: none;
      z-index: 0;
      opacity: .9;
      animation: floating 8s ease-in-out infinite;
    }
    .glow.one { top: -120px; left: -60px; width: 360px; height: 360px; background: rgba(89,240,255,.25); }
    .glow.two { bottom: -140px; right: -60px; width: 420px; height: 420px; background: rgba(203,107,255,.22); animation-duration: 9s; }
    .glow.three { top: 30%; left: 46%; width: 300px; height: 300px; background: rgba(90,167,255,.16); animation-duration: 10s; }

    /* TOPBAR */
    .topbar {
      position: fixed;
      top: 0;
      width: 100%;
      backdrop-filter: blur(10px);
      background: rgba(7,11,20,.58);
      border-bottom: 1px solid var(--line);
      z-index: 20;
    }

    .topbar-inner {
      width: min(1180px, calc(100% - 32px));
      margin: auto;
      padding: 18px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand { display: flex; align-items: center; gap: 14px; }
    .logo {
      width: 44px; height: 44px; border-radius: 16px;
      background: linear-gradient(135deg, var(--cyan), var(--violet));
      box-shadow: 0 12px 36px rgba(89,240,255,.22);
      animation: floating 5s ease-in-out infinite;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 20px;
      border-radius: 18px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: #071018;
      box-shadow: 0 16px 40px rgba(89,240,255,.18);
      transition: .2s ease;
    }

    .btn.secondary {
      background: rgba(255,255,255,.05);
      border: 1px solid var(--line);
      color: white;
      box-shadow: none;
      backdrop-filter: blur(14px);
    }

    main {
      padding-top: 120px;
      width: min(1180px, calc(100% - 32px));
      margin: auto;
    }

    /* EXACT SAME STRUCTURE AS SIGNUP */
    .hero-card,
    .form-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      padding: 34px;
      margin-bottom: 22px;
      animation: fadeUp .8s ease;
    }

    .pill {
      display: inline-flex;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      border: 1px solid var(--line);
      color: var(--cyan);
      font-weight: 700;
      margin-bottom: 20px;
    }

    .hero-card h2 {
      font-size: clamp(2.6rem, 5vw, 4.2rem);
      margin: 0;
      line-height: .96;
    }

    .hero-card p {
      color: var(--muted);
      margin-top: 18px;
      line-height: 1.7;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-top: 16px;
    }

    .field input {
      padding: 15px 16px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: white;
      outline: none;
      font-size: 1rem;
    }

    .message {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.10);
      color: var(--muted);
      min-height: 52px;
    }

    .form-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
  </style>
</head>

<body>

<div class="glow one"></div>
<div class="glow two"></div>
<div class="glow three"></div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"></div>
      <div>
        <h1>Novibe</h1>
        <p>© Novibe Corporation</p>
      </div>
    </div>

    <div class="auth-buttons">
      <a class="btn secondary" href="/signup">Inscription</a>
      <a class="btn" href="/">Accueil</a>
    </div>
  </div>
</header>

<main>

  <!-- HERO (EN HAUT) -->
  <div class="hero-card">
    <div class="pill">Connexion Novibe</div>
    <h2>Reviens sur <span class="grad">Novibe</span><br>en quelques secondes.</h2>
    <p>Connecte-toi avec ton email et ton mot de passe dans une interface cohérente avec la plateforme.</p>
  </div>

  <!-- FORMULAIRE (EN DESSOUS) -->
  <div class="form-card">

    <div class="field">
      <label for="email">Adresse email</label>
      <input id="email" type="email" placeholder="exemple@email.com"/>
    </div>

    <div class="field">
      <label for="password">Mot de passe</label>
      <input id="password" type="password" placeholder="Ton mot de passe"/>
    </div>

    <div class="form-actions">
      <button id="loginBtn" class="btn">Se connecter</button>
      <a class="btn secondary" href="/signup">Créer un compte</a>
    </div>

    <div id="message" class="message">Entre tes identifiants pour te connecter.</div>

  </div>

</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDdMYtSr2FeNGay_Nwv8oLMXg7WVQspOJ8",
    authDomain: "novibe-a5c1f.firebaseapp.com",
    projectId: "novibe-a5c1f",
    storageBucket: "novibe-a5c1f.firebasestorage.app",
    messagingSenderId: "312673438609",
    appId: "1:312673438609:web:2fbf719814a6c8c61a2830"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const emailEl = document.getElementById("email");
  const passwordEl = document.getElementById("password");
  const loginBtn = document.getElementById("loginBtn");
  const messageEl = document.getElementById("message");

  function setMessage(text, isError = false) {
    messageEl.textContent = text;
    messageEl.style.color = isError ? "#ff6b6b" : "var(--muted)";
    messageEl.style.borderColor = isError ? "rgba(255,107,107,.35)" : "rgba(255,255,255,.10)";
  }

  loginBtn.addEventListener("click", async () => {
    const email = emailEl.value.trim();
    const pass = passwordEl.value;

    if (!email || !pass) {
      setMessage("Remplis tous les champs.", true);
      return;
    }

    setMessage("Connexion en cours...");
    loginBtn.disabled = true;
    loginBtn.textContent = "Connexion...";

    try {
      await signInWithEmailAndPassword(auth, email, pass);

      // IMPORTANT : marquer l'utilisateur comme connecté
      localStorage.setItem("novibe-auth", "true");

      setMessage("Connecté. Redirection...");
      setTimeout(() => {
        window.location.href = "/home";
      }, 1000);

    } catch (error) {
      setMessage(error?.message || "Une erreur est survenue.", true);
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = "Se connecter";
    }
  });
</script>

</body>
</html>
