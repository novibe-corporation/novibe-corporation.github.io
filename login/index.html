<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Novibe — Login</title>

  <style>
    :root {
      --bg: #070b14;
      --panel: rgba(255,255,255,.06);
      --line: rgba(255,255,255,.12);
      --text: #ffffff;
      --muted: rgba(255,255,255,.68);
      --cyan: #59f0ff;
      --blue: #5aa7ff;
      --violet: #cb6bff;
      --radius: 22px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(89,240,255,.18), transparent 40%),
        radial-gradient(circle at 80% 30%, rgba(203,107,255,.12), transparent 40%),
        var(--bg);
      color: white;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }

    /* ===== TOPBAR (Novibe identique) ===== */
    .topbar {
      position: fixed;
      top: 0;
      width: 100%;
      backdrop-filter: blur(12px);
      background: rgba(7,11,20,.7);
      border-bottom: 1px solid var(--line);
      z-index: 10;
    }

    .topbar-inner {
      max-width: 1100px;
      margin: auto;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      letter-spacing: -.5px;
    }

    .logo {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--cyan), var(--violet));
    }

    .nav {
      display: flex;
      gap: 18px;
      font-size: .95rem;
      color: rgba(255,255,255,.7);
    }

    .nav a:hover {
      color: white;
    }

    /* ===== MAIN ===== */
    main {
      padding-top: 110px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 110px);
      padding-left: 20px;
      padding-right: 20px;
    }

    .card {
      width: 360px;
      padding: 26px;
      border-radius: var(--radius);
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 6px;
    }

    p {
      color: var(--muted);
      margin-bottom: 18px;
      font-size: .95rem;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(0,0,0,.25);
      color: white;
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      font-weight: 800;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: #071018;
      transition: .2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .hint {
      margin-top: 12px;
      text-align: center;
      font-size: .85rem;
      color: rgba(255,255,255,.6);
    }
  </style>
</head>

<body>

<!-- ===== HEADER NOVIBE ===== -->
<header class="topbar">
  <div class="topbar-inner">

    <div class="brand">
      <div class="logo"></div>
      Novibe
    </div>

    <nav class="nav">
      <a href="/">Accueil</a>
      <a href="/home">Home</a>
      <a href="/wiki">Wiki</a>
    </nav>

  </div>
</header>

<!-- ===== LOGIN ===== -->
<main>

  <div class="card">
    <h1>Connexion</h1>
    <p>Accède à ton espace Novibe</p>

    <input id="user" placeholder="Pseudo" />
    <input id="pass" type="password" placeholder="Mot de passe" />

    <button onclick="login()">Se connecter</button>

    <div class="hint">Prototype local (localStorage)</div>
  </div>

</main>

<script>
  function login() {
    const user = document.getElementById("user").value.trim();
    const pass = document.getElementById("pass").value.trim();

    if (!user || !pass) {
      alert("Remplis tous les champs");
      return;
    }

    // AUTH SIMPLE
    localStorage.setItem("novibe-auth", "true");
    localStorage.setItem("novibe-user", user);

    setTimeout(() => {
      window.location.replace("/home");
    }, 50);
  }

  // auto redirect si déjà connecté
  if (localStorage.getItem("novibe-auth") === "true") {
    window.location.replace("/home");
  }
</script>

</body>
</html>
