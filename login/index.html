<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Novibe — Connexion</title>

  <style>
    :root {
      --bg:#070b14;
      --panel:rgba(255,255,255,.06);
      --line:rgba(255,255,255,.12);
      --text:#fff;
      --muted:rgba(255,255,255,.68);
      --cyan:#59f0ff;
      --blue:#5aa7ff;
      --violet:#cb6bff;
      --pink:#ff6bd6;
      --shadow:0 24px 60px rgba(0,0,0,.35);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:system-ui,Segoe UI,Arial;
      color:var(--text);
      background:
        radial-gradient(circle at 12% 12%, rgba(89,240,255,.22), transparent 24%),
        radial-gradient(circle at 82% 18%, rgba(203,107,255,.20), transparent 24%),
        linear-gradient(180deg,#05070d,#070b14);
      overflow-x:hidden;
    }

    a{color:inherit;text-decoration:none}

    @keyframes fadeUp{
      from{opacity:0;transform:translateY(24px)}
      to{opacity:1;transform:translateY(0)}
    }

    @keyframes floating{
      0%{transform:translateY(0)}
      50%{transform:translateY(-10px)}
      100%{transform:translateY(0)}
    }

    .wrap{min-height:100vh}

    .glow{
      position:fixed;
      border-radius:999px;
      filter:blur(50px);
      opacity:.8;
      z-index:0;
      animation:floating 8s infinite;
    }
    .glow.one{top:-120px;left:-60px;width:360px;height:360px;background:rgba(89,240,255,.25)}
    .glow.two{bottom:-140px;right:-60px;width:420px;height:420px;background:rgba(203,107,255,.22)}

    .topbar{
      position:fixed;
      top:0;left:0;
      width:100%;
      backdrop-filter:blur(10px);
      background:rgba(7,11,20,.6);
      border-bottom:1px solid var(--line);
      z-index:10;
    }

    .topbar-inner{
      width:min(1100px,calc(100% - 32px));
      margin:auto;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:16px 0;
    }

    .logo{
      width:40px;height:40px;
      border-radius:14px;
      background:linear-gradient(135deg,var(--cyan),var(--violet));
      animation:floating 5s infinite;
    }

    main{
      padding-top:110px;
      display:flex;
      justify-content:center;
    }

    .card{
      width:min(520px,calc(100% - 30px));
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:28px;
      box-shadow:var(--shadow);
      padding:28px;
      animation:fadeUp .8s ease;
      backdrop-filter:blur(12px);
    }

    h1{margin:0;font-size:2rem}
    p{color:var(--muted)}

    .field{
      display:grid;
      gap:8px;
      margin-top:16px;
    }

    input{
      padding:14px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
      color:white;
      outline:none;
      transition:.2s;
    }

    input:focus{
      border-color:rgba(89,240,255,.5);
      box-shadow:0 0 0 3px rgba(89,240,255,.12);
    }

    .btn{
      width:100%;
      margin-top:18px;
      padding:14px;
      border:none;
      border-radius:16px;
      cursor:pointer;
      font-weight:800;
      color:#071018;
      background:linear-gradient(135deg,var(--cyan),var(--blue));
      transition:.2s;
    }

    .btn:hover{transform:translateY(-2px)}

    .secondary{
      margin-top:10px;
      display:block;
      text-align:center;
      color:var(--cyan);
      font-weight:600;
    }

    .message{
      margin-top:14px;
      padding:12px;
      border-radius:14px;
      border:1px solid var(--line);
      color:var(--muted);
      min-height:40px;
    }

    .lang{
      margin-top:14px;
      display:flex;
      justify-content:center;
      gap:10px;
      color:var(--muted);
    }

    select{
      background:rgba(255,255,255,.08);
      color:white;
      border:1px solid var(--line);
      padding:10px;
      border-radius:12px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="glow one"></div>
    <div class="glow two"></div>

    <header class="topbar">
      <div class="topbar-inner">
        <div style="display:flex;gap:10px;align-items:center">
          <div class="logo"></div>
          <strong>Novibe</strong>
        </div>
      </div>
    </header>

    <main>
      <div class="card">
        <h1 data-i18n="title">Connexion</h1>
        <p data-i18n="subtitle">Connecte-toi à ton compte Novibe</p>

        <div class="field">
          <label data-i18n="email">Email</label>
          <input id="email" type="email" placeholder="exemple@email.com"/>
        </div>

        <div class="field">
          <label data-i18n="password">Mot de passe</label>
          <input id="password" type="password" placeholder="••••••••"/>
        </div>

        <button class="btn" id="loginBtn" data-i18n="btn">Se connecter</button>

        <a class="secondary" href="/signup" data-i18n="goSignup">Créer un compte</a>

        <div class="message" id="msg">...</div>

        <div class="lang">
          <span data-i18n="lang">Langue :</span>
          <select id="lang">
            <option value="fr">FR</option>
            <option value="en">EN</option>
          </select>
        </div>
      </div>
    </main>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDdMYtSr2FeNGay_Nwv8oLMXg7WVQspOJ8",
  authDomain: "novibe-a5c1f.firebaseapp.com",
  projectId: "novibe-a5c1f",
  storageBucket: "novibe-a5c1f.firebasestorage.app",
  messagingSenderId: "312673438609",
  appId: "1:312673438609:web:2fbf719814a6c8c61a2830"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const t = {
  fr:{
    title:"Connexion",
    subtitle:"Connecte-toi à ton compte Novibe",
    email:"Email",
    password:"Mot de passe",
    btn:"Se connecter",
    goSignup:"Créer un compte",
    lang:"Langue :",
    loading:"Connexion...",
    ok:"Connecté ✔ Redirection...",
    error:"Erreur de connexion"
  },
  en:{
    title:"Login",
    subtitle:"Sign in to your Novibe account",
    email:"Email",
    password:"Password",
    btn:"Login",
    goSignup:"Create account",
    lang:"Language:",
    loading:"Signing in...",
    ok:"Logged in ✔ Redirecting...",
    error:"Login error"
  }
};

const els = {
  email:document.getElementById("email"),
  password:document.getElementById("password"),
  msg:document.getElementById("msg"),
  btn:document.getElementById("loginBtn"),
  lang:document.getElementById("lang")
};

function applyLang(l){
  document.querySelectorAll("[data-i18n]").forEach(e=>{
    const k=e.getAttribute("data-i18n");
    e.textContent=t[l][k];
  });
  els.lang.value=l;
  localStorage.setItem("novibe-lang",l);
}

applyLang(localStorage.getItem("novibe-lang")||"fr");

els.lang.onchange=e=>applyLang(e.target.value);

els.btn.onclick=async()=>{
  const l=els.lang.value;
  const email=els.email.value.trim();
  const pass=els.password.value;

  if(!email||!pass){
    els.msg.textContent=l==="fr"?"Remplis tous les champs":"Fill all fields";
    return;
  }

  try{
    els.btn.disabled=true;
    els.btn.textContent=t[l].loading;

    await signInWithEmailAndPassword(auth,email,pass);

    els.msg.textContent=t[l].ok;

    setTimeout(()=>location.href="/",1200);
  }catch(e){
    els.msg.textContent=t[l].error;
  }finally{
    els.btn.disabled=false;
    els.btn.textContent=t[l].btn;
  }
};
</script>
</body>
</html>
