<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Novibe — Login</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: radial-gradient(circle at 20% 20%, #59f0ff33, transparent 40%),
                  radial-gradient(circle at 80% 30%, #cb6bff22, transparent 40%),
                  #070b14;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      width: 340px;
      padding: 26px;
      border-radius: 20px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }

    h1 {
      margin: 0 0 18px;
      font-size: 1.8rem;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.3);
      color: white;
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      background: linear-gradient(135deg, #59f0ff, #5aa7ff);
      color: #071018;
      transition: .2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .hint {
      font-size: .85rem;
      color: rgba(255,255,255,.6);
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>Connexion Novibe</h1>

  <input id="user" placeholder="Pseudo"/>
  <input id="pass" type="password" placeholder="Mot de passe"/>

  <button onclick="login()">Se connecter</button>

  <div class="hint">Système local (prototype)</div>
</div>

<script>
  function login() {
    const user = document.getElementById("user").value.trim();
    const pass = document.getElementById("pass").value.trim();

    if (!user || !pass) {
      alert("Remplis tous les champs");
      return;
    }

    // ⚠️ AUTH SIMPLIFIÉE (prototype)
    localStorage.setItem("novibe-auth", "true");
    localStorage.setItem("novibe-user", user);

    // IMPORTANT : laisser le temps d'écriture
    setTimeout(() => {
      window.location.replace("/home");
    }, 50);
  }

  // si déjà connecté
  if (localStorage.getItem("novibe-auth") === "true") {
    window.location.replace("/home");
  }
</script>

</body>
</html>
