<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novibe — Login</title>

  <style>
    /* === TOUT LE STYLE IDENTIQUE À /signup === */
    :root {
      --bg: #070b14;
      --panel: rgba(255,255,255,.06);
      --line: rgba(255,255,255,.12);
      --text: #ffffff;
      --muted: rgba(255,255,255,.68);
      --cyan: #59f0ff;
      --blue: #5aa7ff;
      --violet: #cb6bff;
      --pink: #ff6bd6;
      --shadow: 0 24px 60px rgba(0,0,0,.35);
      --radius-lg: 24px;
      --radius-xl: 34px;
    }

    * { box-sizing: border-box; min-width: 0; }
    html, body {
      max-width: 100%;
      overflow-x: hidden;
      background: var(--bg);
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 12%, rgba(89,240,255,.22), transparent 24%),
        radial-gradient(circle at 82% 18%, rgba(203,107,255,.20), transparent 24%),
        radial-gradient(circle at 50% 75%, rgba(90,167,255,.14), transparent 30%),
        linear-gradient(180deg, #05070d 0%, #070b14 45%, #060913 100%);
    }

    a { color: inherit; text-decoration: none; }

    .wrap { min-height: 100vh; position: relative; overflow-x: clip; }
    .glow {
      position: fixed;
      border-radius: 999px;
      filter: blur(50px);
      pointer-events: none;
      z-index: 0;
      opacity: .9;
      animation: floating 8s ease-in-out infinite;
    }
    .glow.one { top: -120px; left: -60px; width: 360px; height: 360px; background: rgba(89,240,255,.25); }
    .glow.two { bottom: -140px; right: -60px; width: 420px; height: 420px; background: rgba(203,107,255,.22); animation-duration: 9s; }
    .glow.three { top: 30%; left: 46%; width: 300px; height: 300px; background: rgba(90,167,255,.16); animation-duration: 10s; }

    @keyframes floating {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }

    /* === TON HEADER EXACT === */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 20;
      backdrop-filter: blur(10px);
      background: rgba(7,11,20,.58);
      border-bottom: 1px solid var(--line);
    }

    .topbar-inner, .container {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 0;
    }

    .brand { display: flex; align-items: center; gap: 14px; }
    .logo {
      width: 44px; height: 44px; border-radius: 16px;
      background: linear-gradient(135deg, var(--cyan), var(--violet));
      box-shadow: 0 12px 36px rgba(89,240,255,.22);
      animation: floating 5s ease-in-out infinite;
    }
    .brand h1 { margin: 0; font-size: 1.4rem; line-height: 1; letter-spacing: -.04em; }
    .brand p { margin: 3px 0 0; color: var(--muted); font-size: .82rem; }

    .auth-buttons {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: nowrap;
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 10px; border: 0; cursor: pointer; font-weight: 800;
      border-radius: 18px; padding: 14px 20px; color: #071018;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      box-shadow: 0 16px 40px rgba(89,240,255,.18);
      transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
      white-space: nowrap;
      animation: pulseGlow 4s infinite;
    }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
    .btn.secondary {
      color: #fff;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--line);
      box-shadow: none;
      backdrop-filter: blur(14px);
    }

    main { padding-top: 110px; }

    /* === FORMULAIRE LOGIN === */
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 34px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      padding: 30px;
      width: min(420px, 100%);
      margin: 40px auto 0;
    }

    .title {
      font-size: 2.4rem;
      font-weight: 900;
      margin-bottom: 10px;
      text-align: center;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 30px;
      text-align: center;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-top: 16px;
    }

    .field input {
      padding: 15px 16px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: white;
      outline: none;
      font-size: 1rem;
    }

    .message {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.10);
      color: var(--muted);
      min-height: 52px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="glow one"></div>
    <div class="glow two"></div>
    <div class="glow three"></div>

    <!-- === TON HEADER EXACT === -->
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="logo"></div>
          <div>
            <h1>Novibe</h1>
            <p>© Novibe Corporation</p>
          </div>
        </div>

        <div class="auth-buttons">
          <a class="btn secondary" href="/signup">Inscription</a>
          <a class="btn" href="/">Accueil</a>
        </div>
      </div>
    </header>

    <main class="container">
      <div class="card">
        <div class="title">Connexion</div>
        <div class="subtitle">Accède à ton espace Novibe.</div>

        <div class="field">
          <label for="email">Adresse email</label>
          <input id="email" type="email" placeholder="exemple@email.com" />
        </div>

        <div class="field">
          <label for="password">Mot de passe</label>
          <input id="password" type="password" placeholder="Ton mot de passe" />
        </div>

        <button id="loginBtn" class="btn" style="margin-top:16px;">Se connecter</button>

        <div id="message" class="message">Entre tes identifiants.</div>
      </div>
    </main>
  </div>
</body>
</html>
