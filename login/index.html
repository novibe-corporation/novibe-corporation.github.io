<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novibe — Login</title>

  <style>
    :root {
      --bg: #070b14;
      --panel: rgba(255,255,255,.06);
      --line: rgba(255,255,255,.12);
      --text: #ffffff;
      --muted: rgba(255,255,255,.68);
      --cyan: #59f0ff;
      --blue: #5aa7ff;
      --violet: #cb6bff;
      --shadow: 0 24px 60px rgba(0,0,0,.35);
      --radius-lg: 24px;
    }

    * { box-sizing: border-box; min-width: 0; }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background:
        radial-gradient(circle at 12% 12%, rgba(89,240,255,.22), transparent 24%),
        radial-gradient(circle at 82% 18%, rgba(203,107,255,.20), transparent 24%),
        radial-gradient(circle at 50% 75%, rgba(90,167,255,.14), transparent 30%),
        linear-gradient(180deg, #05070d 0%, #070b14 45%, #060913 100%);
      color: var(--text);
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }

    /* HEADER — IDENTIQUE AUX AUTRES PAGES */
    .topbar {
      position: fixed;
      top: 0;
      width: 100%;
      backdrop-filter: blur(12px);
      background: rgba(7,11,20,.7);
      border-bottom: 1px solid var(--line);
      z-index: 10;
    }

    .topbar-inner {
      width: min(1180px, calc(100% - 32px));
      margin: auto;
      padding: 16px 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--cyan), var(--violet));
      box-shadow: 0 12px 36px rgba(89,240,255,.22);
    }

    .brand h1 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 800;
    }

    .brand p {
      margin: 2px 0 0;
      font-size: .82rem;
      color: var(--muted);
    }

    .auth-buttons {
      margin-top: 12px;
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 12px 18px;
      border-radius: 16px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: #071018;
      box-shadow: 0 16px 40px rgba(89,240,255,.18);
    }

    .btn.secondary {
      background: rgba(255,255,255,.05);
      border: 1px solid var(--line);
      color: white;
      box-shadow: none;
    }

    main {
      padding-top: 140px;
      width: min(1180px, calc(100% - 32px));
      margin: auto;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 24px;
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      max-width: 420px;
    }

    .title {
      font-size: 2.4rem;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 30px;
    }

    .field {
      display: grid;
      gap: 6px;
      margin-top: 14px;
    }

    .field input {
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.06);
      color: white;
      outline: none;
    }

    .message {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      color: var(--muted);
      font-size: .9rem;
      min-height: 40px;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      color: var(--muted);
      font-size: .9rem;
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">

    <div class="brand">
      <div class="logo"></div>
      <div>
        <h1>Novibe</h1>
        <p>© Novibe Corporation</p>
      </div>
    </div>

    <div class="auth-buttons">
      <a class="btn secondary" href="/signup">Inscription</a>
      <a class="btn" href="/">Accueil</a>
    </div>

  </div>
</header>

<main>

  <div class="title">Connexion</div>
  <div class="subtitle">Connecte-toi pour accéder à ton espace Novibe.</div>

  <div class="card">

    <div class="field">
      <label for="email">Adresse email</label>
      <input id="email" type="email" placeholder="exemple@email.com"/>
    </div>

    <div class="field">
      <label for="password">Mot de passe</label>
      <input id="password" type="password" placeholder="Ton mot de passe"/>
    </div>

    <button id="loginBtn" class="btn" style="margin-top:16px;">Se connecter</button>
    <a class="btn secondary" href="/signup" style="margin-top:10px;">Créer un compte</a>

    <div id="message" class="message">Entre tes identifiants pour te connecter.</div>

  </div>

  <footer>
    © Novibe Corporation — Login sécurisé
  </footer>

</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDdMYtSr2FeNGay_Nwv8oLMXg7WVQspOJ8",
    authDomain: "novibe-a5c1f.firebaseapp.com",
    projectId: "novibe-a5c1f",
    storageBucket: "novibe-a5c1f.firebasestorage.app",
    messagingSenderId: "312673438609",
    appId: "1:312673438609:web:2fbf719814a6c8c61a2830"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const emailEl = document.getElementById("email");
  const passwordEl = document.getElementById("password");
  const loginBtn = document.getElementById("loginBtn");
  const messageEl = document.getElementById("message");

  function setMessage(text, isError = false) {
    messageEl.textContent = text;
    messageEl.style.color = isError ? "#ff6b6b" : "var(--muted)";
    messageEl.style.borderColor = isError ? "rgba(255,107,107,.35)" : "rgba(255,255,255,.12)";
  }

  loginBtn.addEventListener("click", async () => {
    const email = emailEl.value.trim();
    const pass = passwordEl.value;

    if (!email || !pass) {
      setMessage("Remplis tous les champs.", true);
      return;
    }

    setMessage("Connexion en cours...");
    loginBtn.disabled = true;
    loginBtn.textContent = "Connexion...";

    try {
      await signInWithEmailAndPassword(auth, email, pass);
      localStorage.setItem("novibe-auth", "true");
      setMessage("Connecté. Redirection...");
      setTimeout(() => window.location.href = "/home", 1000);
    } catch (error) {
      setMessage(error?.message || "Une erreur est survenue.", true);
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = "Se connecter";
    }
  });
</script>

</body>
</html>
