<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novibe — Login</title>

  <style>
    :root {
      --bg: #070b14;
      --panel: rgba(255,255,255,.06);
      --line: rgba(255,255,255,.12);
      --text: #ffffff;
      --muted: rgba(255,255,255,.68);
      --cyan: #59f0ff;
      --blue: #5aa7ff;
      --violet: #cb6bff;
      --pink: #ff6bd6;
      --shadow: 0 24px 60px rgba(0,0,0,.35);
      --radius-lg: 24px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 12%, rgba(89,240,255,.22), transparent 24%),
        radial-gradient(circle at 82% 18%, rgba(203,107,255,.20), transparent 24%),
        linear-gradient(180deg, #05070d 0%, #070b14 100%);
    }

    a { text-decoration: none; color: inherit; }

    .topbar {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(7,11,20,.6);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      z-index: 20;
    }

    .topbar-inner {
      width: min(1180px, calc(100% - 32px));
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
    }

    .brand { display:flex; align-items:center; gap:12px; }

    .logo {
      width:44px;height:44px;border-radius:14px;
      background: linear-gradient(135deg,var(--cyan),var(--violet));
    }

    nav {
      display:flex;
      gap:20px;
    }

    nav a {
      color: rgba(255,255,255,.7);
      font-size: .95rem;
    }

    nav a:hover { color: white; }

    .auth-buttons {
      display:flex;
      gap:10px;
    }

    .btn {
      padding: 12px 16px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      background: linear-gradient(135deg,var(--cyan),var(--blue));
    }

    .btn.secondary {
      background: rgba(255,255,255,.05);
      border: 1px solid var(--line);
      color: white;
    }

    main {
      padding-top: 110px;
      display:flex;
      justify-content:center;
    }

    .box {
      width: min(520px, 92%);
      margin-top: 60px;
      padding: 28px;
      border-radius: 26px;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 2rem;
    }

    p {
      color: var(--muted);
      margin-bottom: 20px;
    }

    .field {
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-bottom: 14px;
    }

    input {
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.05);
      color: white;
      outline: none;
    }

    .message {
      margin-top: 14px;
      color: var(--muted);
      min-height: 40px;
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"></div>
      <div>
        <strong>Novibe</strong><br>
        <small>© Corporation</small>
      </div>
    </div>

    <nav>
      <a href="/">Home</a>
      <a href="/#features">Features</a>
      <a href="/#hosting">Hosting</a>
    </nav>

    <div class="auth-buttons">
      <a class="btn secondary" href="/signup">Signup</a>

      <!-- MODIF ICI -->
      <a class="btn" href="/signup">Inscription</a>
    </div>
  </div>
</header>

<main>
  <div class="box">
    <h1>Connexion</h1>
    <p>Accède à ton espace Novibe</p>

    <div class="field">
      <label>Email</label>
      <input id="email" type="email" placeholder="email@novibe.com">
    </div>

    <div class="field">
      <label>Mot de passe</label>
      <input id="password" type="password" placeholder="••••••••">
    </div>

    <button class="btn" id="loginBtn" style="width:100%;">Se connecter</button>

    <div class="message" id="message"></div>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDdMYtSr2FeNGay_Nwv8oLMXg7WVQspOJ8",
  authDomain: "novibe-a5c1f.firebaseapp.com",
  projectId: "novibe-a5c1f",
  storageBucket: "novibe-a5c1f.firebasestorage.app",
  messagingSenderId: "312673438609",
  appId: "1:312673438609:web:2fbf719814a6c8c61a2830"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const email = document.getElementById("email");
const password = document.getElementById("password");
const btn = document.getElementById("loginBtn");
const msg = document.getElementById("message");

btn.addEventListener("click", async () => {
  try {
    await signInWithEmailAndPassword(auth, email.value, password.value);

    localStorage.setItem("novibe-auth", "true");

    msg.textContent = "Connexion réussie...";
    msg.style.color = "#59f0ff";

    setTimeout(() => {
      window.location.href = "/home";
    }, 800);

  } catch (e) {
    msg.textContent = "Erreur : " + e.message;
    msg.style.color = "#ff6bd6";
  }
});
</script>

</body>
</html>
